<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkrone — Connexion</title>
    <meta name="description" content="Une seule connexion Synkrone : Discord, Google, GitHub ou e-mail pour le site et le panel.">
    <script src="/assets/theme-boot.js"></script>
    <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/design/synkrone.css">
    <style>
        .login-list { display: grid; gap: .75rem; }
        .login-list a, .login-list button { width: 100%; }
        .login-page-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .login-note { margin-top: 1.25rem; font-size: .9rem; color: var(--sk-text-muted); }
        .login-note a { color: var(--mousse); }
        .login-form { display: grid; gap: 10px; margin-top: 8px; }
        .login-form label { font-size: 12px; color: var(--sk-text-muted); }
        .login-form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--sk-border);
            background: var(--sk-bg);
            color: inherit;
        }
        .login-error { color: #8f2d2d; font-size: .9rem; min-height: 1.2em; }
        .login-divider { margin: 18px 0 8px; font-size: 12px; color: var(--sk-text-faint); }
    </style>
</head>
<body>
    <main class="sk-center-page">
        <article class="sk-card">
            <div class="login-page-bar" id="theme-bar"></div>
            <p class="sk-kicker">Compte</p>
            <h1>Se connecter</h1>
            <p class="lede" id="login-lede">Une porte : Discord, Google, GitHub ou e-mail. Le même Discord ouvre le site (Krônes, Bump, Me) et le panel (créer un service).</p>
            <div class="login-list" id="providers"></div>
            <p class="login-divider" id="panel-divider" hidden>Ou avec un e-mail (hébergement)</p>
            <form class="login-form" id="panel-form" hidden>
                <label for="panel-email">E-mail</label>
                <input id="panel-email" type="email" autocomplete="username" required>
                <label for="panel-password">Mot de passe</label>
                <input id="panel-password" type="password" autocomplete="current-password" required>
                <label for="panel-name" id="panel-name-label" hidden>Nom</label>
                <input id="panel-name" type="text" hidden autocomplete="nickname">
                <p class="login-error" id="panel-error"></p>
                <button type="submit" class="sk-btn" id="panel-submit">Se connecter au panel</button>
                <button type="button" class="sk-btn" id="panel-toggle">Créer un compte hébergement</button>
            </form>
            <p class="login-note">Lecture seule, sans Krônes, Bump ni tickets : <a href="/auth/guest" target="_top">continuer sans compte</a>.</p>
        </article>
    </main>
    <script>
        (function () {
            const theme = window.synkroneTheme ? synkroneTheme.read() : 'light';
            const bar = document.getElementById('theme-bar');
            if (bar) {
                const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v1.5M12 19.5V21M4.5 12H3M21 12h-1.5M6.2 6.2l1.1 1.1M16.7 16.7l1.1 1.1M6.2 17.8l1.1-1.1M16.7 7.3l1.1-1.1"></path></svg>';
                const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5A8.5 8.5 0 1 1 8.5 4 7 7 0 0 0 20 15.5z"></path></svg>';
                bar.innerHTML = `<div class="theme-toggle" role="group" aria-label="Thème">
                    <button type="button" class="theme-opt" title="Clair" aria-pressed="${theme === 'light'}" data-theme-set="light">${sun}<span>Clair</span></button>
                    <button type="button" class="theme-opt" title="Sombre" aria-pressed="${theme === 'dark'}" data-theme-set="dark">${moon}<span>Sombre</span></button>
                </div>`;
                bar.querySelectorAll('[data-theme-set]').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        const next = btn.getAttribute('data-theme-set');
                        synkroneTheme.set(next);
                        bar.querySelectorAll('[data-theme-set]').forEach((el) => {
                            el.setAttribute('aria-pressed', el.getAttribute('data-theme-set') === next ? 'true' : 'false');
                        });
                    });
                });
            }
        })();
        const params = new URLSearchParams(window.location.search);
        const intent = params.get('intent') || '';
        const oauthError = params.get('oauth_error') || '';
        let mode = params.get('mode') === 'register' ? 'register' : 'login';
        function readReturnTo() {
            const local = params.get('returnTo');
            if (local && local.startsWith('/')) return local;
            if (intent === 'panel') return '/hebergement';
            return '/';
        }
        function isDiscordAccount(user) {
            return /^\d{15,22}$/.test(String(user?.id || ''))
                || /^\d{15,22}$/.test(String(user?.providers?.discord || user?.discordId || ''));
        }
        const returnTo = readReturnTo();
        const needsDiscord = returnTo.startsWith('/serveur');
        function href(provider) {
            return `/auth/${provider}?returnTo=${encodeURIComponent(returnTo)}`;
        }
        function setMode(next) {
            mode = next;
            const name = document.getElementById('panel-name');
            const nameLabel = document.getElementById('panel-name-label');
            const submit = document.getElementById('panel-submit');
            const toggle = document.getElementById('panel-toggle');
            const showName = mode === 'register';
            name.hidden = !showName;
            nameLabel.hidden = !showName;
            name.required = showName;
            submit.textContent = showName ? 'Créer le compte hébergement' : 'Se connecter au panel';
            toggle.textContent = showName ? 'J’ai déjà un e-mail' : 'Créer un compte hébergement';
        }
        document.getElementById('panel-toggle').addEventListener('click', () => {
            setMode(mode === 'login' ? 'register' : 'login');
        });
        document.getElementById('panel-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const errorEl = document.getElementById('panel-error');
            errorEl.textContent = '';
            const email = document.getElementById('panel-email').value.trim();
            const password = document.getElementById('panel-password').value;
            const name = document.getElementById('panel-name').value.trim();
            const payload = mode === 'register' ? { email, password, name } : { email, password };
            try {
                const res = await fetch(`/hebergement/api/auth/${mode}`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    errorEl.textContent = data.error || data.message || 'Connexion panel impossible.';
                    return;
                }
                await fetch('/api/auth/sync-panel', { method: 'POST', credentials: 'same-origin' });
                window.location.href = returnTo.startsWith('/') ? returnTo : '/hebergement';
            } catch {
                errorEl.textContent = 'Panel injoignable.';
            }
        });
        setMode(mode);
        if (oauthError) {
            const map = {
                linked_other: 'Ce Discord, Google ou GitHub est déjà lié à un autre compte.',
                PROVIDER_TAKEN: 'Ce compte est déjà lié à un autre profil Synkrone.',
                denied: 'Connexion annulée.'
            };
            document.getElementById('panel-error').textContent = map[oauthError] || 'Connexion refusée.';
        }
        (async () => {
            try {
                const res = await fetch('/api/me', { credentials: 'same-origin' });
                const data = await res.json();
                const user = data.user;
                if (data.authenticated && (!needsDiscord || isDiscordAccount(user))) {
                    window.location.href = returnTo.startsWith('/') ? returnTo : '/';
                    return;
                }
                const p = data.providers || {};
                const box = document.getElementById('providers');
                const items = [];
                if (p.discord) items.push(`<a class="sk-btn sk-btn-discord" href="${href('discord')}" target="_top">Continuer avec Discord</a>`);
                if (p.github && !needsDiscord) items.push(`<a class="sk-btn" href="${href('github')}" target="_top">Continuer avec GitHub</a>`);
                if (p.google && !needsDiscord) items.push(`<a class="sk-btn" href="${href('google')}" target="_top">Continuer avec Google</a>`);
                if (needsDiscord && data.authenticated && !isDiscordAccount(user)) {
                    items.unshift('<p class="note">Cette page demande un compte Discord.</p>');
                }
                box.innerHTML = items.join('') || '<p>Aucune connexion sociale n’est configurée pour le moment.</p>';
                document.getElementById('panel-form').hidden = false;
                document.getElementById('panel-divider').hidden = false;
            } catch {
                document.getElementById('providers').innerHTML = '<p>Connexion indisponible.</p>';
                document.getElementById('panel-form').hidden = false;
            }
        })();
    </script>
</body>
</html>
