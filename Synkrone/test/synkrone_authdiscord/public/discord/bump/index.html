<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="/assets/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkrone | Plateforme Serveurs & Bots</title>
    <!-- Ajout de FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #eef0ea;
            --surface: #ffffff;
            --surface-hover: #e3e6dd;
            --surface-active: #e4ece4;
            --border: #5c6a661f;
            --border-hover: #5c6a6640;
            
            --accent: #3f6b52;
            --accent-2: #3f6b52;
            --accent-gold: #b8823d;
            --krones: #b8823d;
            
            --text: #1b211e;
            --text-dim: #5c6a66;
            
            --radius: 6px;
            --radius-sm: 4px;
            --transition: background 0.15s ease, border-color 0.15s ease;
            
            --role-owner: #a8462f;
            --role-admin: #2e5039;
            --role-member: #5c6a66;
        }

        /* Reset strict pour supprimer absolument toutes les marges */
        * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        *::-webkit-scrollbar { width: 6px; height: 6px; }
        *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
            color: var(--text);
            display: flex;
            background: var(--bg);
        }
        @media (max-width: 800px) {
            html, body {
                width: 100%;
                height: auto;
                min-height: 100%;
                overflow: auto;
                display: block;
            }
        }

        /* Couche dynamique pour le background personnalisé du profil */
        #dynamic-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: none;
            background-size: cover;
            background-position: center;
            transition: var(--transition);
        }

        #app-layout { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            flex-direction: column;
            z-index: 1;
        }

        #main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; position: relative; }
        .page-container { max-width: 1200px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; padding: 10px 18px; font-size: 14px; transition: var(--transition); }
        .btn-primary { background: var(--accent-2); color: #fff; }
        .btn-primary:hover { background: #5c7ae6; }
        .btn-join { background: #5865F2; color: #fff; font-weight: bold; width: 100%; padding: 12px; font-size: 16px; margin-top: 15px;}
        .btn-join:hover { background: #4752C4; }
        .btn-success { background: var(--krones); color: #000; }
        .btn-success:hover { background: #3cb868; }
        .btn-danger { background: rgba(225, 79, 79, 0.2); border: 1px solid var(--accent); color: var(--accent); }
        .btn-danger:hover { background: rgba(225, 79, 79, 0.4); }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: var(--border-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: none; border: none; color: var(--text-dim); padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: var(--transition); white-space: nowrap; }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .tab-btn.active { background: var(--surface-active); color: var(--accent-2); border: 1px solid rgba(109, 140, 255, 0.4); }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-dim); }
        .form-control { background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 8px; font-family: inherit; width: 100%; transition: var(--transition);}
        .form-control:focus { outline: none; border-color: var(--accent-2); background: rgba(0,0,0,0.5);}
        .color-picker { padding: 0; height: 40px; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: transparent; width: 100%; overflow: hidden; }

        .marquee-container { padding: 10px; overflow: hidden; display: flex; align-items: center; border-radius: var(--radius); }
        .marquee-track { display: flex; align-items: center; gap: 12px; width: max-content; animation: marquee-right 30s linear infinite; }
        .marquee-track:hover { animation-play-state: paused; }
        .marquee-item { display: inline-flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer; transition: var(--transition); }
        .marquee-item:hover { border-color: var(--accent-gold); background: rgba(255, 215, 0, 0.1); }
        .marquee-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        @keyframes marquee-right { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        
        .server-card { background: var(--blanc, #fff); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; position: relative; }
        .server-card:hover { border-color: var(--border-hover); background: var(--surface-hover); }
        .server-card.featured { border-color: var(--accent-gold); background: var(--ambre-clair, #f3e7d3); }
        
        .server-top { display: flex; align-items: center; gap: 12px; }
        .server-icon { width: 54px; height: 54px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--border); }
        .server-info { flex: 1; min-width: 0; }
        .server-name { font-family: var(--sk-serif, "Zilla Slab", Georgia, serif); font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;}
        
        .role-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; margin-bottom: 5px;}
        .role-owner { background: var(--brique-clair, #f5e2dc); color: var(--brique, #a8462f); }
        .role-admin { background: var(--mousse-clair, #e4ece4); color: var(--mousse-fonce, #2e5039); }
        .role-member { background: var(--pierre-2, #e3e6dd); color: var(--ardoise, #5c6a66); }

        .profile-wrapper { border-radius: var(--radius); overflow: hidden; transition: var(--transition); display: flex; flex-direction: column; border: 1px solid var(--border); background: var(--surface); }
        .profile-banner { width: 100%; height: 200px; position: relative; }
        .profile-content { padding: 24px; flex: 1; position: relative; display: flex; flex-direction: column; }
        
        .hero-profile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin-top: -80px; margin-bottom: 20px; }
        .avatar-wrap { width: 120px; height: 120px; border-radius: var(--radius-sm); padding: 4px; background: var(--bg); position: relative; z-index: 2; border: 1px solid var(--border); }
        .avatar-wrap img { width: 100%; height: 100%; border-radius: calc(var(--radius-sm) - 4px); object-fit: cover; }
        
        .profile-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 10; }
        .nav-controls { display: flex; gap: 10px; margin-bottom: 15px; justify-content: space-between;}
        .nav-controls-left { display: flex; gap: 10px; }
        .nav-controls-right { display: flex; gap: 10px; margin-left: auto; }
        
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .shop-item { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 15px; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; }
        
        .synkrone-warning { background: rgba(225, 79, 79, 0.1); border: 1px solid var(--accent); color: var(--text); padding: 15px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 15px; margin-bottom: 20px;}
        
        .list-section { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px; margin-top: 20px; }
        .data-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .data-chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 8px;}

        /* Modal Classique */
        .modal-overlay { position: fixed; inset: 0; background: rgba(27, 33, 30, 0.45); z-index: 999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 420px; transform: scale(0.95); transition: transform 0.2s; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #fff; }
        .modal-text { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

        /* Modal Liste Complète */
        #listModalBox { max-width: 500px; max-height: 80vh; display: flex; flex-direction: column; }
        #listModalContent { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; padding-right: 5px; }
    </style>
    <link rel="stylesheet" href="/design/synkrone.css">
    <link rel="stylesheet" href="/assets/app-pages.css">
</head>
<body>

    <div id="dynamic-bg"></div>

    <!-- Modal Classique de confirmation -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Titre</div>
            <div class="modal-text" id="modalText">Texte</div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modalCancelBtn" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" id="modalConfirmBtn">Confirmer</button>
            </div>
        </div>
    </div>

    <!-- Modal d'affichage de la liste complète -->
    <div class="modal-overlay" id="listModal">
        <div class="modal-box" id="listModalBox">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
                <div class="modal-title" style="margin:0;" id="listModalTitle">Liste Complète</div>
                <button class="btn btn-outline" style="padding: 5px 10px;" onclick="closeListModal()">Fermer</button>
            </div>
            <div id="listModalContent">
                <!-- Contenu injecté -->
            </div>
        </div>
    </div>

    <div id="app-layout">
        <!-- Main Content -->
        <main id="main-content">
            <div class="page-container" id="view-container">
                <!-- Vues injectées par JS -->
            </div>
        </main>
    </div>

    <script>
        let store = { user: null };
        let MonProfil = { likedServers: [] };
        let AllServers = [];

        const ShopItems = {
            featured: { id: 'featured', name: 'Mise en avant (2 Heures)', desc: 'Apparaître en haut de l\'explorateur. Durée limitée.', cost: 50 },
            theme: { id: 'theme', name: 'Personnalisation Thème', desc: 'Modifier l\'apparence, l\'URL et le fond de page.', cost: 50 },
            owners: { id: 'owners', name: 'Afficher Owner', desc: 'Montrer le fondateur sur la bannière.', cost: 10 },
            admins: { id: 'admins', name: 'Afficher Admins', desc: 'Montrer l\'équipe de modération.', cost: 10 },
            bots: { id: 'bots', name: 'Afficher Bots', desc: 'Lister les bots présents.', cost: 10 },
            roles: { id: 'roles', name: 'Afficher Rôles', desc: 'Montrer les rôles principaux.', cost: 10 },
            channels: { id: 'channels', name: 'Afficher Salons', desc: 'Aperçu de la structure du serveur.', cost: 10 }
        };

        const viewContainer = document.getElementById('view-container');
        
        let currentExplorerTab = 'featured';
        let currentMyServersFilter = 'all';
        let modalCallback = null;

        // Fonction pour gérer le background de fond de page (Global)
        function updateGlobalBackground(theme) {
            const dynBg = document.getElementById('dynamic-bg');
            if(theme && theme.active) {
                if (theme.bgImg) {
                    dynBg.style.background = `url('${theme.bgImg}') center/cover fixed`;
                } else if (theme.bg) {
                    dynBg.style.background = theme.bg;
                }
            } else {
                dynBg.style.background = '';
            }
        }

        // Système de Modals
        function showModal(title, text, confirmLabel, onConfirm, showCancel = true) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').innerHTML = text;
            const btnConfirm = document.getElementById('modalConfirmBtn');
            const btnCancel = document.getElementById('modalCancelBtn');
            
            btnConfirm.textContent = confirmLabel;
            btnCancel.style.display = showCancel ? 'inline-flex' : 'none';
            modalCallback = onConfirm;
            
            document.getElementById('customModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
            modalCallback = null;
        }

        function showListModal(serverId, featureKey, title) {
            let server = AllServers.find(s => s.id === serverId);
            let data = server.internalData[featureKey];
            
            document.getElementById('listModalTitle').textContent = title;
            
            // On réutilise la même logique d'affichage que renderPublicSection, mais pour tous les éléments
            let html = data.map(item => {
                if (featureKey === 'roles' || featureKey === 'channels') {
                    return `<div class="data-chip w-full" style="justify-content: flex-start; padding: 10px;">${item}</div>`;
                } else {
                    return `
                        <div class="data-chip w-full" style="justify-content: flex-start; padding: 10px; gap:12px;">
                            <img src="${item.avatar || '/assets/images/logo.jpg'}" alt="" style="width:28px; height:28px; border-radius:50%;">
                            <span style="font-weight:bold;">${item.name}</span>
                        </div>
                    `;
                }
            }).join('');

            document.getElementById('listModalContent').innerHTML = html;
            document.getElementById('listModal').classList.add('active');
        }

        function closeListModal() {
            document.getElementById('listModal').classList.remove('active');
        }

        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            if(modalCallback) modalCallback();
            closeModal();
        });

        // Navigation
        async function navigate(view, params = null) {
            viewContainer.innerHTML = '';
            
            if (view === 'explorer') {
                updateGlobalBackground(null); // Reset background
                renderExplorer();
            }
            else if (view === 'myservers') {
                updateGlobalBackground(null);
                renderMyServers();
            }
            else if (view === 'server_profile') {
                await fetchRealServerData(params); 
                renderServerProfile(params);
            }
            else if (view === 'server_edit') {
                updateGlobalBackground(null);
                await fetchRealServerData(params);
                renderServerEdit(params);
            }
        }

        // --- Fetch des Vraies Données API Discord & Options achetées ---
        async function fetchRealServerData(serverId) {
            let server = AllServers.find(s => s.id === serverId);
            if (!server) return;
            
            try {
                const resMod = await fetch(`/api/discord/bump/server/${serverId}/modules`);
                if (resMod.ok) {
                    const dataMod = await resMod.json();
                    server.unlockedFeatures = dataMod.purchasedModules || [];
                    server.disabledFeatures = dataMod.disabledModules || [];
                    
                    if (dataMod.featuredUntil && new Date(dataMod.featuredUntil) > new Date()) {
                        server.isFeatured = true;
                    } else {
                        server.isFeatured = false;
                    }
                }
            } catch (e) {
                console.error("Impossible de récupérer les modules", e);
            }

            try {
                const resDet = await fetch(`/api/discord/bump/server/${serverId}/details`);
                if (resDet.ok) {
                    const discordData = await resDet.json();
                    
                    server.stats.members = discordData.members || server.stats.members;
                    server.stats.online = discordData.online || server.stats.online;
                    
                    if (discordData.owner) server.internalData.owners = [discordData.owner];
                    server.internalData.admins = discordData.admins || [];
                    server.internalData.bots = discordData.bots || [];
                    server.internalData.roles = discordData.roles || [];
                    server.internalData.channels = discordData.channels || [];
                    
                    server.hasSynkrone = true;
                } else {
                    server.hasSynkrone = false;
                }
            } catch (e) {
                console.error("Bot non présent ou erreur API", e);
                server.hasSynkrone = false;
            }
        }

        // --- Vue Explorateur ---
        function renderExplorer() {
            let totalServers = AllServers.length;
            let totalMembers = AllServers.reduce((acc, s) => acc + s.stats.members, 0);
            
            const featuredServers = AllServers.filter(s => s.isFeatured);
            const marqueeServers = featuredServers.length > 0 ? featuredServers : AllServers.slice(0, 10);
            
            let html = `
                <section class="panel bump-intro">
                    <h1>Bump</h1>
                    <p>Listing public de serveurs Discord, sur le même principe que Disboard : parcourir, rejoindre, mettre le sien en avant.</p>
                    <p>Pour ajouter un serveur, connectez-vous et invitez au moins un bot officiel Synkrone (Vax, Arceus, Asuna, Kayaba ou Yui). Sans ça, le serveur n’apparaît pas dans Mes serveurs.</p>
                    <ol>
                        <li><strong>1. Compte</strong>Se connecter (Discord, Google ou GitHub). Discord doit être lié.</li>
                        <li><strong>2. Bot officiel</strong>Un des cinq sur le serveur, et vous admin ou propriétaire.</li>
                        <li><strong>3. Publier</strong>Mes serveurs → fiche, bump, mise en avant en Krônes.</li>
                    </ol>
                </section>
                <div class="nav-controls">
                    <div class="nav-controls-right">
                        ${store.user ? `
                            <button class="btn btn-primary" onclick="navigate('myservers')">Mes serveurs</button>
                        ` : `
                            <button class="btn btn-outline" onclick="window.top.location.href='/login?returnTo=/discord/bump'">Se connecter pour ajouter un serveur</button>
                        `}
                    </div>
                </div>

                ${marqueeServers.length ? `
                <section class="panel marquee-container">
                    <div class="marquee-track">
                        ${[...marqueeServers, ...marqueeServers, ...marqueeServers].map(s => `
                            <div class="marquee-item" onclick="navigate('server_profile', '${s.id}')">
                                <img class="marquee-avatar" src="${s.icon}" alt="">
                                <span style="font-size:13px; font-weight:700; color:var(--text);">${s.name}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>
                ` : ''}

                <div class="panel">
                    <h1>Serveurs listés</h1>
                    <p class="bump-stats">${totalServers.toLocaleString('fr-FR')} serveur${totalServers > 1 ? 's' : ''} · ${totalMembers.toLocaleString('fr-FR')} membres</p>
                    <div class="tabs" style="margin-bottom: 0; border:none;">
                        <button class="tab-btn ${currentExplorerTab === 'featured' ? 'active' : ''}" onclick="setExplorerTab('featured')">Mis en avant</button>
                        <button class="tab-btn ${currentExplorerTab === 'top' ? 'active' : ''}" onclick="setExplorerTab('top')">Classement</button>
                        <button class="tab-btn ${currentExplorerTab === 'all' ? 'active' : ''}" onclick="setExplorerTab('all')">Tous</button>
                    </div>
                </div>
                
                <div id="explorer-content"></div>
            `;
            viewContainer.innerHTML = html;
            renderExplorerContent();
        }

        window.setExplorerTab = function(tab) { currentExplorerTab = tab; renderExplorer(); }

        function renderExplorerContent() {
            const content = document.getElementById('explorer-content');
            let list = [];

            if(currentExplorerTab === 'featured') {
                list = AllServers.filter(s => s.isFeatured);
            } else if(currentExplorerTab === 'top') {
                list = [...AllServers].sort((a,b) => b.stats.views - a.stats.views);
            } else {
                list = AllServers;
            }

            if(list.length === 0) {
                const hint = currentExplorerTab === 'featured'
                    ? 'Aucun serveur n’est mis en avant pour le moment. Parcourez Tous, ou ajoutez le vôtre depuis Mes serveurs.'
                    : 'Aucun serveur dans cette liste. Connectez-vous, invitez un bot officiel, puis ouvrez Mes serveurs.';
                content.innerHTML = `<div class="panel" style="padding: 28px; color:var(--text-dim); line-height:1.55;">${hint}</div>`;
                return;
            }

            content.innerHTML = `<div class="grid-cards">${list.map(s => createServerCard(s)).join('')}</div>`;
        }

        function createServerCard(server) {
            let roleHtml = '';
            if(server.userRole === 'owner') roleHtml = `<span class="role-badge role-owner">Propriétaire</span>`;
            else if(server.userRole === 'admin') roleHtml = `<span class="role-badge role-admin">Admin</span>`;
            else if(server.userRole === 'member') roleHtml = `<span class="role-badge role-member">Membre</span>`;

            return `
                <div class="server-card ${server.isFeatured ? 'featured' : ''}" onclick="navigate('server_profile', '${server.id}')">
                    ${server.isFeatured ? '<span class="role-badge role-featured">Mis en avant</span>' : ''}
                    <div class="server-top">
                        <img src="${server.icon}" class="server-icon" alt="" onerror="this.src='/assets/images/logo.jpg'">
                        <div class="server-info">
                            <div class="server-name">${server.name}</div>
                            ${roleHtml}
                            <div class="profile-stats" style="justify-content:flex-start; margin-top:4px;">
                                <span>${server.stats.members} membres</span>
                                <span class="is-online">${server.stats.online} en ligne</span>
                            </div>
                        </div>
                    </div>
                    <p class="profile-desc" style="margin:0; text-align:left;">${server.desc.substring(0,70)}...</p>
                </div>
            `;
        }

        // --- Vue Mes Serveurs ---
        function renderMyServers() {
            let myServers = AllServers.filter(s => s.userRole !== 'none');
            
            let html = `
                <div class="nav-controls">
                    <div class="nav-controls-left">
                        <button class="btn btn-outline" onclick="navigate('explorer')">Retour à l'accueil</button>
                    </div>
                </div>
                <div class="panel">
                    <h1>Mes serveurs</h1>
                    <p style="color:var(--text-dim); max-width:62ch; line-height:1.55; margin: 0 0 20px;">Serveurs où vous êtes propriétaire ou admin, et où un bot officiel Synkrone est présent. De là vous publiez la fiche, vous bumper et vous achetez une mise en avant.</p>
                    
                    <div class="tabs">
                        <button class="tab-btn ${currentMyServersFilter === 'all' ? 'active' : ''}" onclick="setMyServersFilter('all')">Tous</button>
                        <button class="tab-btn ${currentMyServersFilter === 'owner' ? 'active' : ''}" onclick="setMyServersFilter('owner')">Mes Propriétés</button>
                        <button class="tab-btn ${currentMyServersFilter === 'admin' ? 'active' : ''}" onclick="setMyServersFilter('admin')">Administration</button>
                    </div>

                    <div id="myservers-content"></div>
                </div>
            `;
            viewContainer.innerHTML = html;
            renderMyServersContent(myServers);
        }

        window.setMyServersFilter = function(filter) {
            currentMyServersFilter = filter;
            renderMyServers();
        }

        function renderMyServersContent(myServers) {
            const content = document.getElementById('myservers-content');
            let list = myServers;
            
            if(currentMyServersFilter === 'owner') list = list.filter(s => s.userRole === 'owner');
            if(currentMyServersFilter === 'admin') list = list.filter(s => s.userRole === 'admin' || s.userRole === 'owner');

            if(list.length === 0) {
                content.innerHTML = `<p style="color:var(--text-dim); line-height:1.55; padding: 8px 0 20px;">Aucun serveur ici. Vérifiez que vous êtes connecté avec Discord, que vous êtes admin ou propriétaire, et qu’au moins un bot officiel (Vax, Arceus, Asuna, Kayaba ou Yui) est sur le serveur.</p>`;
                return;
            }

            content.innerHTML = `<div class="grid-cards">${list.map(s => createServerCardEdit(s)).join('')}</div>`;
        }

        function createServerCardEdit(server) {
            let roleHtml = '';
            if(server.userRole === 'owner') roleHtml = `<span class="role-badge role-owner">Propriétaire</span>`;
            else if(server.userRole === 'admin') roleHtml = `<span class="role-badge role-admin">Admin</span>`;

            let canEdit = server.userRole === 'owner' || server.userRole === 'admin';
            let actionBtn = canEdit 
                ? `<button class="btn btn-outline" style="width:100%; margin-top:10px; font-size:12px;" onclick="event.stopPropagation(); navigate('server_edit', '${server.id}')">Gérer le profil</button>`
                : `<button class="btn btn-outline" style="width:100%; margin-top:10px; font-size:12px;" onclick="event.stopPropagation(); navigate('server_profile', '${server.id}')">Voir le profil</button>`;

            return `
                <div class="server-card" onclick="navigate('server_profile', '${server.id}')">
                    <div class="server-top">
                        <img src="${server.icon}" class="server-icon" alt="" onerror="this.src='/assets/images/logo.jpg'">
                        <div class="server-info">
                            <div class="server-name">${server.name}</div>
                            ${roleHtml}
                        </div>
                    </div>
                    ${actionBtn}
                </div>
            `;
        }

        // --- Vue Profil du Serveur (Public) ---
        function renderServerProfile(serverId) {
            let server = AllServers.find(s => s.id === serverId);
            if(!server) return;

            server.stats.views++;
            
            let isLiked = MonProfil.likedServers.includes(server.id);
            let canEdit = server.userRole === 'owner' || server.userRole === 'admin';
            
            let isThemeActive = server.unlockedFeatures.includes('theme') && server.customTheme.active && !server.disabledFeatures.includes('theme');
            let th = isThemeActive
                ? server.customTheme
                : { bg: '', bgImg: '', text: '', border: '', panelBg: '', bannerBg: '', inviteType: 'auto', customInviteUrl: '' };

            updateGlobalBackground(isThemeActive ? th : null);

            let bannerStyle = '';
            if (server.banner) {
                bannerStyle = `background: url('${server.banner}') center/cover;`;
            } else if (isThemeActive && th.bannerBg) {
                bannerStyle = `background: ${th.bannerBg};`;
            }

            let ownerHtml = '';
            if (server.unlockedFeatures.includes('owners') && !server.disabledFeatures.includes('owners') && server.internalData.owners.length > 0) {
                let owner = server.internalData.owners[0];
                ownerHtml = `
                    <div class="profile-owner">
                        <img src="${owner.avatar || '/assets/images/logo.jpg'}" alt="">
                        <div>
                            <small>Propriétaire</small>
                            <strong>${owner.name || 'Inconnu'}</strong>
                        </div>
                    </div>
                `;
            }

            // Lien d'invitation
            let inviteLink = (th.inviteType === 'custom' && th.customInviteUrl) ? th.customInviteUrl : "https://discord.gg/p768u2Pgp3";

            const wrapperStyle = isThemeActive
                ? `background:${th.panelBg || '#fff'};color:${th.text || '#1b211e'};border-color:${th.border || '#5c6a661f'};`
                : '';
            const avatarStyle = isThemeActive ? `background:${th.bg || '#fff'};border-color:${th.border || '#5c6a661f'};` : '';
            const titleStyle = isThemeActive && th.text ? `color:${th.text};` : '';

            let html = `
                <div class="nav-controls">
                    <div class="nav-controls-left">
                        <button class="btn btn-outline" onclick="navigate('explorer')">Accueil</button>
                        ${store.user ? `<button class="btn btn-outline" onclick="navigate('myservers')">Mes serveurs</button>` : ''}
                    </div>
                </div>
                
                <div class="profile-wrapper" style="${wrapperStyle}">
                    <div class="profile-banner" style="${bannerStyle}">
                        ${ownerHtml}
                    </div>
                    
                    <div class="profile-content">
                        <div class="profile-controls">
                            ${canEdit ? `<button class="btn btn-outline" onclick="navigate('server_edit', '${server.id}')">Gérer</button>` : ''}
                            <button class="btn ${isLiked ? 'btn-primary' : 'btn-outline'}" onclick="toggleServerLike('${server.id}')">
                                ${isLiked ? 'Aimé' : 'Aimer'} (${server.stats.likes})
                            </button>
                        </div>

                        <div class="hero-profile">
                            <div class="avatar-wrap" style="${avatarStyle}">
                                <img src="${server.icon}" alt="" onerror="this.src='/assets/images/logo.jpg'">
                            </div>
                            <h1 style="${titleStyle}">${server.name}</h1>
                            <div class="profile-stats">
                                <span>${server.stats.members.toLocaleString('fr-FR')} membres</span>
                                <span class="is-online">${server.stats.online.toLocaleString('fr-FR')} en ligne</span>
                                <span>${server.stats.views.toLocaleString('fr-FR')} vues</span>
                            </div>
                            <p class="profile-desc">${server.desc}</p>
                            <button type="button" onclick="window.open('${inviteLink}', '_blank')" class="btn-join" style="max-width: 300px;">
                                Rejoindre le serveur
                            </button>
                        </div>
                        
                        <div class="profile-sections">
                            ${renderPublicSection(server, 'admins', 'Administration', (data) => data.map(u => `<div class="data-chip"><img src="${u.avatar}" alt="" style="width:20px; height:20px; border-radius:50%;">${u.name}</div>`).join(''))}
                            ${renderPublicSection(server, 'bots', 'Bots', (data) => data.map(b => `<div class="data-chip"><img src="${b.avatar}" alt="" style="width:20px; height:20px; border-radius:50%;">${b.name}</div>`).join(''))}
                            ${renderPublicSection(server, 'roles', 'Rôles', (data) => data.map(r => `<div class="data-chip">${r}</div>`).join(''))}
                            ${renderPublicSection(server, 'channels', 'Salons', (data) => data.map(c => `<div class="data-chip"># ${c}</div>`).join(''))}
                        </div>
                    </div>
                </div>
            `;
            viewContainer.innerHTML = html;
        }

        // Modifie la génération des sections pour n'afficher que les 5 premiers, avec bouton "Voir la suite", et permet de s'aligner côte à côte
        function renderPublicSection(server, featureKey, title, renderFn) {
            if(!server.unlockedFeatures.includes(featureKey) || server.disabledFeatures.includes(featureKey)) return '';
            let data = server.internalData[featureKey];
            if(!data || data.length === 0) return '';
            
            let displayData = data.slice(0, 5);
            let contentHtml = renderFn(displayData);
            
            let btnHtml = '';
            if (data.length > 5) {
                btnHtml = `<button class="btn btn-outline" style="width:100%; margin-top:10px; font-size:12px;" onclick="showListModal('${server.id}', '${featureKey}', '${title}')">
                                Voir les ${data.length - 5} autres
                           </button>`;
            }
            
            return `
                <section class="profile-section">
                    <h3>${title}</h3>
                    <div class="data-list" style="display:flex; flex-direction:column; flex: 1;">${contentHtml}</div>
                    ${btnHtml}
                </section>
            `;
        }

        window.toggleServerLike = function(serverId) {
            let idx = MonProfil.likedServers.indexOf(serverId);
            let server = AllServers.find(s => s.id === serverId);
            if(idx === -1) {
                MonProfil.likedServers.push(serverId);
                server.stats.likes++;
            } else {
                MonProfil.likedServers.splice(idx, 1);
                server.stats.likes--;
            }
            renderServerProfile(serverId);
        }

        // --- Vue Édition du Serveur ---
        function renderServerEdit(serverId) {
            let server = AllServers.find(s => s.id === serverId);
            if(!server || (server.userRole !== 'owner' && server.userRole !== 'admin')) {
                viewContainer.innerHTML = `<div class="panel">Accès refusé.</div>`;
                return;
            }

            let html = `
                <div class="nav-controls">
                    <div class="nav-controls-left">
                        <button class="btn btn-outline" onclick="navigate('explorer')">Accueil</button>
                        <button class="btn btn-outline" onclick="navigate('server_profile', '${server.id}')">Retour au profil</button>
                    </div>
                </div>
                
                <div class="panel">
                    <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 5px;">Gérer : ${server.name}</h1>
                    <p style="color:var(--text-dim); font-size:13px; margin-bottom: 24px;">Paramétrez le profil public de votre serveur et gérez vos fonctionnalités.</p>

                    ${!server.hasSynkrone ? `
                        <div class="synkrone-warning">
                            <div>
                                <strong style="display:block; margin-bottom:4px;">Le bot Synkrone n'est pas sur ce serveur.</strong>
                                <span style="font-size:13px; color:var(--text-dim);">Vous ne pouvez pas activer de fonctionnalités internes tant que le bot n'est pas invité.</span>
                            </div>
                        </div>
                    ` : `
                        <div class="synkrone-warning is-ok">
                            <div>
                                <strong style="display:block; margin-bottom:4px;">Bot Synkrone détecté</strong>
                                <span style="font-size:13px; color:var(--text-dim);">Les statistiques en direct et les listes dynamiques sont opérationnelles.</span>
                            </div>
                        </div>
                    `}

                    <div class="list-section">
                        <h3 style="margin-bottom:15px;">Informations Générales</h3>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="editDesc" class="form-control" rows="3">${server.desc}</textarea>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                            <div class="form-group"><label>Lien Icône</label><input type="text" id="editIcon" class="form-control" value="${server.icon}"></div>
                            <div class="form-group"><label>Lien Bannière (Image)</label><input type="text" id="editBanner" class="form-control" value="${server.banner}"></div>
                        </div>
                        <button class="btn btn-primary" style="margin-top:10px;" onclick="saveServerBasic('${server.id}')">Sauvegarder les infos</button>
                    </div>

                    <h2 style="font-size: 20px; font-weight: 700; margin-top: 30px; margin-bottom: 10px;">Boutique Modules & Visibilité</h2>
                    <p style="color:var(--text-dim); font-size:13px; margin-bottom: 15px;">Achetez des fonctionnalités pour améliorer la page de votre serveur et désactivez-les au besoin.</p>
                    
                    <div class="shop-grid">
                        ${Object.values(ShopItems).map(item => createShopItem(server, item)).join('')}
                    </div>

                    ${server.unlockedFeatures.includes('theme') ? `
                        <div class="list-section">
                            <h3 style="margin-bottom:15px; display:flex; justify-content:space-between;">
                                Configuration Avancée (Thème & URL) 
                                <label style="font-size:13px; font-weight:normal; display:flex; align-items:center; gap:8px;">
                                    <input type="checkbox" id="themeActive" ${server.customTheme.active ? 'checked' : ''}> Activer la customisation
                                </label>
                            </h3>
                            
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                                <div class="form-group">
                                    <label>URL Personnalisée (ex: /me/...)</label>
                                    <input type="text" id="themeCustomUrl" class="form-control" value="${server.customTheme.customUrl || ''}" placeholder="mon-super-serveur">
                                </div>
                                <div class="form-group">
                                    <label>Type d'invitation</label>
                                    <select id="themeInviteType" class="form-control" onchange="document.getElementById('themeInviteLinkBox').style.display = this.value === 'custom' ? 'block' : 'none'">
                                        <option value="auto" ${server.customTheme.inviteType !== 'custom' ? 'selected' : ''}>Automatique</option>
                                        <option value="custom" ${server.customTheme.inviteType === 'custom' ? 'selected' : ''}>Personnalisé</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-group" id="themeInviteLinkBox" style="display: ${server.customTheme.inviteType === 'custom' ? 'block' : 'none'};">
                                <label>Lien d'invitation personnalisé</label>
                                <input type="text" id="themeCustomInviteUrl" class="form-control" value="${server.customTheme.customInviteUrl || ''}" placeholder="https://discord.gg/...">
                            </div>

                            <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">

                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                <div class="form-group">
                                    <label>Couleur de Fond Globale</label>
                                    <input type="color" id="themeBg" class="color-picker" value="${server.customTheme.bg || '#eef0ea'}">
                                </div>
                                <div class="form-group">
                                    <label>Image de fond (Prioritaire, URL)</label>
                                    <input type="text" id="themeBgImg" class="form-control" value="${server.customTheme.bgImg || ''}" placeholder="https://...">
                                </div>
                                <div class="form-group">
                                    <label>Couleur du Texte</label>
                                    <input type="color" id="themeText" class="color-picker" value="${server.customTheme.text || '#1b211e'}">
                                </div>
                                <div class="form-group">
                                    <label>Couleur d'Accentuation (Bordures)</label>
                                    <input type="color" id="themeBorder" class="color-picker" value="${server.customTheme.border || '#3f6b52'}">
                                </div>
                                <div class="form-group">
                                    <label>Fond des Panneaux (Couleur) </label>
                                    <input type="text" id="themePanelBg" class="form-control" value="${server.customTheme.panelBg || '#ffffff'}">
                                </div>
                                <div class="form-group">
                                    <label>Couleur Unie de la Bannière</label>
                                    <input type="color" id="themeBannerBg" class="color-picker" value="${server.customTheme.bannerBg || '#e3e6dd'}">
                                </div>
                            </div>
                            <button class="btn btn-primary" style="margin-top:15px;" onclick="saveServerTheme('${server.id}')">Sauvegarder les paramètres</button>
                        </div>
                    ` : ''}
                </div>
            `;
            viewContainer.innerHTML = html;
        }

        function createShopItem(server, item) {
            let isUnlocked = server.unlockedFeatures.includes(item.id) || (item.id === 'featured' && server.isFeatured);
            let isDisabled = server.disabledFeatures.includes(item.id);
            let needsBot = ['owners', 'admins', 'bots', 'roles', 'channels'].includes(item.id);
            let disabledStr = (!server.hasSynkrone && needsBot) ? 'disabled title="Nécessite le bot"' : '';

            let actionHtml = '';

            if (item.id === 'featured') {
                if (server.isFeatured) {
                    actionHtml = `<button class="btn" style="width:100%; font-size:12px;" disabled>Déjà mis en avant</button>`;
                } else {
                    actionHtml = `<button class="btn btn-outline" style="width:100%; font-size:12px;" onclick="buyServerFeature('${server.id}', '${item.id}')">Acheter (${item.cost} ₭)</button>`;
                }
            } else {
                if (isUnlocked) {
                    if (isDisabled) {
                        actionHtml = `<button class="btn btn-outline" style="width:100%; font-size:12px; border-color:var(--krones); color:var(--krones);" onclick="toggleServerFeature('${server.id}', '${item.id}', 'enable')">Activer</button>`;
                    } else {
                        actionHtml = `<button class="btn btn-danger" style="width:100%; font-size:12px;" onclick="toggleServerFeature('${server.id}', '${item.id}', 'disable')">Désactiver</button>`;
                    }
                } else {
                    actionHtml = `<button class="btn btn-outline" style="width:100%; font-size:12px;" ${disabledStr} onclick="buyServerFeature('${server.id}', '${item.id}')">Acheter (${item.cost} ₭)</button>`;
                }
            }

            return `
                <div class="shop-item ${isUnlocked && !isDisabled ? 'unlocked' : ''}">
                    <div>
                        <div style="font-weight:700; font-size:15px; margin-bottom:5px;">${item.name}</div>
                        <div style="font-size:12px; color:var(--text-dim); line-height:1.4;">${item.desc}</div>
                    </div>
                    <div style="margin-top:15px;">${actionHtml}</div>
                </div>
            `;
        }

        // --- Logique Actions Config ---
        window.saveServerBasic = function(serverId) {
            let server = AllServers.find(s => s.id === serverId);
            server.desc = document.getElementById('editDesc').value;
            server.icon = document.getElementById('editIcon').value;
            server.banner = document.getElementById('editBanner').value;
            showModal("Succès", "Informations du serveur enregistrées.", "OK", null, false);
        }

        window.saveServerTheme = function(serverId) {
            let server = AllServers.find(s => s.id === serverId);
            server.customTheme = {
                active: document.getElementById('themeActive').checked,
                bg: document.getElementById('themeBg').value,
                bgImg: document.getElementById('themeBgImg').value,
                text: document.getElementById('themeText').value,
                border: document.getElementById('themeBorder').value,
                panelBg: document.getElementById('themePanelBg').value,
                bannerBg: document.getElementById('themeBannerBg').value,
                customUrl: document.getElementById('themeCustomUrl').value,
                inviteType: document.getElementById('themeInviteType').value,
                customInviteUrl: document.getElementById('themeCustomInviteUrl').value
            };
            showModal("Succès", "La configuration personnalisée a été appliquée.", "OK", null, false);
        }

        window.buyServerFeature = async function(serverId, featureId) {
            let server = AllServers.find(s => s.id === serverId);
            let item = ShopItems[featureId];

            showModal(
                "Confirmation", 
                `Voulez-vous acquérir <b>${item.name}</b> pour <b>${server.name}</b> ?<br><br>Coût : ${item.cost} Kr.`,
                "Confirmer l'achat", 
                async () => {
                    try {
                        const res = await fetch(`/api/discord/bump/server/${server.id}/buy`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ itemId: featureId, cost: item.cost })
                        });
                        if (res.ok) {
                            if(featureId === 'featured') {
                                server.isFeatured = true;
                            } else {
                                server.unlockedFeatures.push(featureId);
                                if(featureId === 'theme' && !server.customTheme.bg) {
                                    server.customTheme = { active: false, bg: '#eef0ea', bgImg: '', text: '#1b211e', border: '#3f6b52', panelBg: '#ffffff', bannerBg: '#e3e6dd', customUrl: '', inviteType: 'auto', customInviteUrl: '' };
                                }
                            }
                            if (window.parent && window.parent.refreshSessionUserSilently) {
                                window.parent.refreshSessionUserSilently();
                            }
                            renderServerEdit(serverId);
                        } else {
                            showModal("Erreur", "Fonds insuffisants ou erreur API.", "Fermer", null, false);
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }
            );
        }

        window.toggleServerFeature = async function(serverId, featureId, action) {
            let server = AllServers.find(s => s.id === serverId);
            try {
                const res = await fetch(`/api/discord/bump/server/${serverId}/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemId: featureId, action })
                });
                if (res.ok) {
                    if (action === 'disable') server.disabledFeatures.push(featureId);
                    else server.disabledFeatures = server.disabledFeatures.filter(id => id !== featureId);
                    renderServerEdit(serverId);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function initApp() { 
            try { 
                const r = await fetch("/api/me"); 
                const d = await r.json(); 
                store.user = d.authenticated ? d.user : null; 
                
                const srv = await fetch("/api/discord/bump/servers"); 
                if(srv.ok) { 
                    const sd = await srv.json(); 
                    AllServers = (sd.servers || []).map(x=>({
                        id: x.id, 
                        name: x.name, 
                        desc: "Serveur synchronisé avec l'infrastructure Synkrone.", 
                        icon: x.icon ? ("https://cdn.discordapp.com/icons/" + x.id + "/" + x.icon + ".png") : "/assets/images/logo.jpg", 
                        banner: "", 
                        stats: {views:0, likes:0, members: 0, online: 0}, 
                        userRole: x.role, 
                        hasSynkrone: false, 
                        isFeatured: false, 
                        unlockedFeatures: [], 
                        disabledFeatures: [],
                        customTheme: {active: false}, 
                        internalData: { owners: [], admins: [], bots: [], roles: [], channels: [] }
                    })); 
                }
            } catch (e) { console.error(e); } 
            
            navigate("explorer"); 
        } 
        
        initApp();
    </script>
</body>
</html>
