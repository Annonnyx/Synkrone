<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="/assets/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkrone — Me</title>
    <meta name="description" content="Profils publics Me : se retrouver, visites, likes, mise en avant.">
    <link rel="stylesheet" href="/assets/mosaique.css">
    <script src="/assets/mosaique.js" defer></script>
    <link rel="stylesheet" href="/design/synkrone.css">
    <link rel="stylesheet" href="/assets/app-pages.css">
    <style>
        body { margin: 0; min-height: 100%; }
        #app-layout { width: 100%; }
        #main-content { overflow-y: auto; }
        .page-container { max-width: 1040px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; }
        .tab-btn, .view-btn, .time-btn, .btn, .btn-slim-gray, .link-action {
            font-family: inherit; cursor: pointer;
        }
        .tab-btn { background: none; border: 0; color: #5c6a66; padding: 8px 12px; font-size: 14px; font-weight: 600; border-radius: 4px; }
        .tab-btn.active { background: #e4ece4; color: #1b211e; }
        .view-controls, .time-toggle { display: inline-flex; gap: 4px; }
        .view-btn, .time-btn { background: #fff; border: 1px solid #5c6a6640; color: #5c6a66; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
        .view-btn.active, .time-btn.active { background: #e4ece4; color: #1b211e; border-color: #3f6b52; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .list-view { display: flex; flex-direction: column; gap: 10px; }
        .user-card, .user-list-item { background: #fff; border: 1px solid #5c6a661f; border-radius: 6px; cursor: pointer; }
        .user-card { padding: 20px; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .user-list-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
        .user-avatar { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #e3e6dd; }
        .user-list-item .user-avatar { width: 36px; height: 36px; }
        .user-name { font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .user-stats, .user-card p { font-size: 13px; color: #5c6a66; }
        .profile-wrapper { border: 1px solid #5c6a661f; border-radius: 6px; overflow: hidden; background: #fff; }
        .profile-content { padding: 20px 24px 28px; position: relative; }
        .hero-profile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin-top: -56px; }
        .avatar-wrap { width: 104px; height: 104px; border-radius: 6px; padding: 3px; background: #fff; border: 1px solid #5c6a661f; }
        .avatar-wrap img { width: 100%; height: 100%; border-radius: 4px; object-fit: cover; }
        .profile-name { font-family: "Zilla Slab", Georgia, serif; font-size: 1.7rem; font-weight: 700; margin: 0; }
        .profile-subtitle { color: #5c6a66; max-width: 38rem; line-height: 1.5; }
        .profile-controls { position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; }
        .nav-btn-floating { position: absolute; top: 16px; left: 16px; z-index: 2; }
        .link-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
        .link-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 6px; }
        .link-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .link-icon { font-size: 12px; font-weight: 600; color: #2e5039; background: #e4ece4; border-radius: 4px; padding: 6px 8px; }
        .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #5c6a66; }
        .form-control { background: #fff; border: 1px solid #5c6a6640; color: #1b211e; padding: 10px 12px; border-radius: 4px; width: 100%; font: inherit; }
        .btn { padding: 10px 16px; border-radius: 4px; border: 0; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: #3f6b52; color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #5c6a6640; color: #1b211e; }
        .btn-success { background: #b8823d; color: #fff; }
        .link-edit-list { display: flex; flex-direction: column; gap: 10px; }
        .link-edit-item { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px; background: #eef0ea; border-radius: 6px; }
        .color-picker-wrap { display: flex; align-items: center; gap: 8px; }
        .color-picker { width: 32px; height: 32px; border: 0; background: none; padding: 0; }
        .rank-badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 600; }
        .modal-overlay { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { background: #fff; border: 1px solid #5c6a661f; border-radius: 6px; padding: 24px; width: 90%; max-width: 400px; text-align: center; }
        .like-btn-mini, .like-main-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            border: 1px solid #5c6a661f; background: #fff; color: #5c6a66; cursor: pointer;
            font: inherit; font-weight: 600;
        }
        .like-btn-mini { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; padding: 0; border-radius: 50%; z-index: 2; }
        .like-main-btn { padding: 8px 12px; border-radius: 4px; }
        .like-btn-mini:hover, .like-main-btn:hover { color: #a8462f; border-color: #a8462f; }
        .like-heart { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
        .like-btn-mini .like-heart { width: 15px; height: 15px; }
        .liked .like-heart { fill: currentColor; }
        .user-list-item .like-btn-mini { position: relative; top: auto; right: auto; }
        .filter-bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    </style>
</head>
<body class="mosaic-bg">
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Titre</div>
            <div class="modal-text" id="modalText"></div>
            <div class="modal-actions" style="display:flex;gap:10px;justify-content:center;">
                <button class="btn btn-outline" type="button" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" type="button" id="modalConfirmBtn">Confirmer</button>
            </div>
        </div>
    </div>

    <div id="app-layout">
        <main id="main-content">
            <div class="page-container" id="view-container"></div>
        </main>
    </div>

    <script>
        const Ranks = {
            base: { name: 'Membre', bonusLinks: 0, class: 'rank-base' },
            soutien: { name: 'Soutien', bonusLinks: 5, class: 'rank-soutien' },
            vip: { name: 'VIP', bonusLinks: 15, class: 'rank-vip' },
            premium: { name: 'Premium', bonusLinks: 50, class: 'rank-premium' }
        };
        const NETWORKS = [
            { id: 'discord', label: 'Discord' },
            { id: 'twitter', label: 'X' },
            { id: 'instagram', label: 'Instagram' },
            { id: 'youtube', label: 'YouTube' },
            { id: 'github', label: 'GitHub' },
            { id: 'twitch', label: 'Twitch' },
            { id: 'custom', label: 'Lien' }
        ];
        const KEYWORDS = {
            jeu: ['jeux', 'gaming', 'gamer', 'joueur'],
            utilitaire: ['util', 'utilitaires', 'utility', 'tools', 'outil'],
            dev: ['developpement', 'code', 'programmeur', 'coder'],
            design: ['graphisme', 'dessin', 'ui', 'ux', 'art']
        };

        let Utilisateurs = [];
        let MonProfil = null;
        let currentHomeTab = 'all';
        let currentHomeTime = 'month';
        let homeViewMode = 'grid';
        let modalCallback = null;
        let bannerBusy = false;

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }
        function displayName(user) {
            return user?.name || user?.username || 'Utilisateur';
        }
        function bannerOf(user) {
            return String(user?.banner || '').trim();
        }
        function bannerStyle(user) {
            const url = bannerOf(user);
            return url ? `background-image:url('${esc(url)}')` : '';
        }
        function heartIcon() {
            return '<svg class="like-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
        }
        function safeHref(value) {
            try {
                const url = new URL(value, window.location.origin);
                if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
            } catch { /* ignore */ }
            return '';
        }
        function hydrateMe(user) {
            if (!user) return null;
            user.links = Array.isArray(user.links) ? user.links : [];
            user.likedProfiles = Array.isArray(user.likedProfiles) ? user.likedProfiles : [];
            user.unlockedPrivacies = Array.isArray(user.unlockedPrivacies) ? user.unlockedPrivacies : ['private'];
            user.stats = user.stats || { visitsTotal: 0, visitsMonth: 0, likesTotal: 0, likesMonth: 0 };
            user.customTheme = user.customTheme || { active: false, bg: '#eef0ea', text: '#1b211e', border: '#3f6b52', panelBg: '#ffffff' };
            user.extraLinkSlots = Number(user.extraLinkSlots) || 0;
            user.rank = user.rank || 'base';
            user.krones = user.krone ?? user.krones ?? 0;
            return user;
        }
        function networkLabel(id) {
            return NETWORKS.find((item) => item.id === id)?.label || 'Lien';
        }

        function setIframeFullscreen(isFullscreen) {
            try {
                const frame = window.parent?.document?.getElementById('content-frame');
                if (!frame) return;
                frame.style.position = isFullscreen ? 'fixed' : '';
                frame.style.inset = isFullscreen ? '0' : '';
                frame.style.width = isFullscreen ? '100vw' : '100%';
                frame.style.height = isFullscreen ? '100vh' : '100%';
                frame.style.zIndex = isFullscreen ? '9999' : '';
            } catch { /* ignore */ }
        }

        function fetchJson(url, ms = 4000) {
            const ctrl = new AbortController();
            const timer = window.setTimeout(() => ctrl.abort(), ms);
            return fetch(url, { signal: ctrl.signal }).finally(() => window.clearTimeout(timer));
        }

        function initialMeRoute() {
            const profileParam = new URLSearchParams(window.location.search).get('profile');
            if (profileParam) return ['profile', profileParam];
            try {
                const parentPath = window.parent !== window ? window.parent.location.pathname : window.location.pathname;
                const segments = parentPath.split('/').filter(Boolean);
                if (segments[0] && segments[0] !== 'discord' && segments[0] !== 'accueil') {
                    return ['profile', segments[0]];
                }
            } catch { /* ignore */ }
            return ['home'];
        }

        async function initData() {
            const route = initialMeRoute();
            navigate(...route);
            try {
                const meRes = await fetchJson('/api/me');
                if (meRes.ok) {
                    const meData = await meRes.json();
                    if (meData.authenticated) MonProfil = hydrateMe(meData.user);
                }
                const profilesRes = await fetchJson('/api/profiles');
                if (profilesRes.ok) {
                    const profData = await profilesRes.json();
                    Utilisateurs = (profData.profiles || []).map(hydrateMe);
                }
            } catch (err) {
                console.error(err);
            }
            navigate(...route);
        }

        function goKrones() {
            try {
                if (window.parent !== window && typeof window.parent.navigateToMainSection === 'function') {
                    window.parent.navigateToMainSection('krones', { updateUrl: true });
                    return;
                }
            } catch { /* ignore */ }
            window.top.location.href = '/krones';
        }

        function syncUserToParent() {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'synkrone:user-updated', user: MonProfil }, window.location.origin);
            }
        }

        function setParentUrl(targetUrl) {
            const apply = () => {
                if (window.parent !== window) window.parent.history.replaceState(null, '', targetUrl);
                else window.history.replaceState(null, '', targetUrl);
            };
            setTimeout(apply, 80);
        }

        const viewContainer = document.getElementById('view-container');

        function showModal(title, text, confirmLabel, onConfirm) {
            setIframeFullscreen(true);
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').innerHTML = text;
            document.getElementById('modalConfirmBtn').textContent = confirmLabel;
            modalCallback = onConfirm;
            document.getElementById('customModal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
            setIframeFullscreen(false);
            modalCallback = null;
        }
        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            if (modalCallback) modalCallback();
            closeModal();
        });

        function navigate(view, params = null) {
            viewContainer.innerHTML = '';
            if (view === 'home') {
                setParentUrl('/discord/me');
                renderHome();
            } else if (view === 'profile') renderProfile(params);
            else if (view === 'edit') renderEdit();
        }

        window.navigateProfile = function () {
            if (!MonProfil) {
                showModal('Connexion', 'Connectez-vous pour ouvrir votre profil.', 'Se connecter', () => {
                    window.top.location.href = '/login?returnTo=/discord/me';
                });
                return;
            }
            navigate('profile', 'me');
        };

        function publicUsers() {
            const now = Date.now();
            const list = Utilisateurs.filter((user) => user.privacy === 'public').map((user) => {
                user.featured = Boolean(user.featuredUntil && user.featuredUntil > now);
                return user;
            });
            if (MonProfil && MonProfil.privacy === 'public' && !list.find((user) => user.id === MonProfil.id)) {
                MonProfil.featured = Boolean(MonProfil.featuredUntil && MonProfil.featuredUntil > now);
                list.push(MonProfil);
            }
            list.sort((a, b) => {
                if (a.featured && !b.featured) return -1;
                if (!a.featured && b.featured) return 1;
                return (b.featuredUntil || 0) - (a.featuredUntil || 0);
            });
            return list;
        }

        function renderHome() {
            viewContainer.innerHTML = `
                <div class="me-intro">
                    <div>
                        <h1>Profils</h1>
                        <p>Pages publiques des membres. La vôtre se personnalise avec une bannière, des liens et un thème.</p>
                    </div>
                    <div class="me-toolbar">
                        <button type="button" class="btn btn-outline" onclick="goKrones()">Krônes</button>
                        ${MonProfil ? `<button type="button" class="btn btn-primary" onclick="navigateProfile()">Mon profil</button>` : ''}
                    </div>
                </div>
                <div class="panel filter-bar">
                    <div class="tabs">
                        <button type="button" class="tab-btn ${currentHomeTab === 'all' ? 'active' : ''}" onclick="setHomeTab('all')">Tous</button>
                        <button type="button" class="tab-btn ${currentHomeTab === 'featured' ? 'active' : ''}" onclick="setHomeTab('featured')">À la une</button>
                        <button type="button" class="tab-btn ${currentHomeTab === 'visited' ? 'active' : ''}" onclick="setHomeTab('visited')">Visités</button>
                        <button type="button" class="tab-btn ${currentHomeTab === 'liked' ? 'active' : ''}" onclick="setHomeTab('liked')">Aimés</button>
                    </div>
                    <div id="home-controls-dynamic" class="me-toolbar"></div>
                </div>
                <div id="home-content"></div>
            `;
            renderHomeContent();
        }

        window.setHomeTab = function (tab) { currentHomeTab = tab; renderHome(); };
        window.setHomeTime = function (time) { currentHomeTime = time; renderHomeContent(); };
        window.setViewMode = function (mode) { homeViewMode = mode; renderHomeContent(); };

        function renderHomeContent() {
            const content = document.getElementById('home-content');
            const controls = document.getElementById('home-controls-dynamic');
            const users = publicUsers();
            const viewSwitch = `
                <div class="view-controls">
                    <button type="button" class="view-btn ${homeViewMode === 'grid' ? 'active' : ''}" onclick="setViewMode('grid')">Cartes</button>
                    <button type="button" class="view-btn ${homeViewMode === 'list' ? 'active' : ''}" onclick="setViewMode('list')">Liste</button>
                </div>`;
            let extra = '';
            let list = users;
            let sortKey = null;

            if (currentHomeTab === 'featured') list = users.filter((user) => user.featured);
            else if (currentHomeTab === 'visited' || currentHomeTab === 'liked') {
                sortKey = (currentHomeTab === 'visited' ? 'visits' : 'likes') + (currentHomeTime === 'month' ? 'Month' : 'Total');
                list = [...users].sort((a, b) => (b.stats?.[sortKey] || 0) - (a.stats?.[sortKey] || 0)).slice(0, 10);
                extra = `
                    <div class="time-toggle">
                        <button type="button" class="time-btn ${currentHomeTime === 'month' ? 'active' : ''}" onclick="setHomeTime('month')">Mois</button>
                        <button type="button" class="time-btn ${currentHomeTime === 'total' ? 'active' : ''}" onclick="setHomeTime('total')">Total</button>
                    </div>`;
            } else {
                extra = `<input type="search" id="tabSearchInput" class="form-control" style="width:220px" placeholder="Pseudo ou mot-clé" oninput="filterAllTab(this.value)">`;
            }

            if (controls) controls.innerHTML = extra + viewSwitch;
            if (!content) return;
            if (!list.length) {
                content.innerHTML = '<div class="panel" style="text-align:center">Aucun profil pour le moment.</div>';
                return;
            }
            content.innerHTML = `<div class="${homeViewMode === 'grid' ? 'grid-cards' : 'list-view'}" id="allTabGrid">${list.map((user) => createUserCard(user, user.featured, sortKey)).join('')}</div>`;
        }

        window.filterAllTab = function (query) {
            query = query.toLowerCase().trim();
            const grid = document.getElementById('allTabGrid');
            if (!grid) return;
            const wanted = [query];
            for (const [key, aliases] of Object.entries(KEYWORDS)) {
                if (key.includes(query) || aliases.some((item) => item.includes(query))) wanted.push(key, ...aliases);
            }
            const filtered = publicUsers().filter((user) => {
                if ((user.username || '').toLowerCase().includes(query)) return true;
                if ((user.name || '').toLowerCase().includes(query)) return true;
                return (user.keywords || []).some((word) => wanted.some((item) => word.includes(item) || item.includes(word)));
            });
            grid.innerHTML = filtered.length
                ? filtered.map((user) => createUserCard(user, user.featured)).join('')
                : '<p style="grid-column:1/-1;text-align:center;color:#5c6a66">Aucun résultat.</p>';
        };

        function createUserCard(user, featured = false, sortKey = null) {
            const name = esc(displayName(user));
            const statVal = sortKey ? (user.stats?.[sortKey] || 0) : (user.stats?.visitsTotal || 0);
            const liked = MonProfil && (MonProfil.likedProfiles || []).includes(user.id);
            const like = (MonProfil && user.id !== MonProfil.id)
                ? `<button type="button" class="like-btn-mini ${liked ? 'liked' : ''}" onclick="event.stopPropagation(); toggleLike('${esc(user.id)}')" title="${liked ? 'Retirer le j’aime' : 'Aimer'}" aria-label="${liked ? 'Retirer le j’aime' : 'Aimer'}" aria-pressed="${liked}">${heartIcon()}</button>`
                : '';
            const rank = user.rank && user.rank !== 'base'
                ? `<span class="rank-badge ${Ranks[user.rank]?.class || 'rank-base'}">${esc(Ranks[user.rank]?.name || '')}</span>`
                : '';
            const sub = esc((user.subtitle || 'Aucune description').slice(0, 80));

            if (homeViewMode === 'list') {
                return `
                    <div class="user-list-item ${featured ? 'featured' : ''}" onclick="navigate('profile', '${esc(user.id)}')">
                        <img src="${esc(user.avatar || '/assets/images/logo.jpg')}" class="user-avatar" alt="">
                        <div class="user-name">${name} ${rank}</div>
                        <p>${sub}</p>
                        ${featured ? '<span class="featured-badge role-badge role-featured">À la une</span>' : ''}
                        <div class="user-stats">${statVal}</div>
                        ${like}
                    </div>`;
            }
            return `
                <div class="user-card ${featured ? 'featured' : ''}" onclick="navigate('profile', '${esc(user.id)}')">
                    <div class="me-card-banner" style="${bannerStyle(user)}"></div>
                    ${featured ? '<span class="featured-badge role-badge role-featured">À la une</span>' : ''}
                    ${like}
                    <div class="user-card-header" style="display:flex;align-items:center;gap:12px">
                        <img src="${esc(user.avatar || '/assets/images/logo.jpg')}" class="user-avatar" alt="">
                        <div>
                            <div class="user-name">${name} ${rank}</div>
                            <div class="user-stats">${statVal} visites</div>
                        </div>
                    </div>
                    <p>${sub}</p>
                </div>`;
        }

        window.toggleLike = async function (userId) {
            if (!MonProfil) return;
            const target = Utilisateurs.find((user) => user.id === userId);
            if (!target) return;
            const idx = MonProfil.likedProfiles.indexOf(userId);
            if (idx === -1) {
                MonProfil.likedProfiles.push(userId);
                target.stats.likesTotal = (target.stats.likesTotal || 0) + 1;
                target.stats.likesMonth = (target.stats.likesMonth || 0) + 1;
            } else {
                MonProfil.likedProfiles.splice(idx, 1);
                target.stats.likesTotal = Math.max(0, (target.stats.likesTotal || 0) - 1);
                target.stats.likesMonth = Math.max(0, (target.stats.likesMonth || 0) - 1);
            }
            await fetch('/api/me/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ likedProfiles: MonProfil.likedProfiles })
            }).catch(() => undefined);
            if (document.getElementById('home-content')) renderHomeContent();
            else navigate('profile', userId);
        };

        function renderProfile(userId) {
            let user = null;
            if (userId === 'me' || (MonProfil && [MonProfil.id, MonProfil.customUrl, MonProfil.username].includes(userId))) {
                user = MonProfil;
            } else {
                user = Utilisateurs.find((item) => item.id === userId || item.customUrl === userId || item.username === userId);
            }
            if (!user) {
                viewContainer.innerHTML = '<div class="panel" style="text-align:center">Profil introuvable ou privé.</div>';
                return;
            }
            const isMe = Boolean(MonProfil && (userId === 'me' || user.id === MonProfil.id));
            setParentUrl(user.customUrl ? `/${user.customUrl}` : `/${user.id}`);
            const liked = !isMe && MonProfil && MonProfil.likedProfiles.includes(user.id);
            const theme = user.customTheme?.active ? user.customTheme : { bg: '#fff', text: '#1b211e', border: '#3f6b52', panelBg: '#eef0ea' };
            const name = esc(displayName(user));
            const rank = user.rank && user.rank !== 'base'
                ? `<span class="rank-badge ${Ranks[user.rank].class}">${esc(Ranks[user.rank].name)}</span>`
                : '';

            viewContainer.innerHTML = `
                <div class="profile-wrapper" style="background:${esc(theme.bg)};color:${esc(theme.text)}">
                    <button type="button" class="btn btn-outline nav-btn-floating" onclick="navigate('home')">Retour</button>
                    <div class="me-banner-frame profile-banner" style="${bannerStyle(user)}"></div>
                    <div class="profile-content">
                        ${isMe ? `<div class="profile-controls">
                            <button type="button" class="btn btn-outline" onclick="navigate('edit')">Modifier</button>
                            <button type="button" class="btn btn-outline" onclick="bumpMe()">Bump</button>
                        </div>` : ''}
                        ${(!isMe && MonProfil) ? `<div class="profile-controls">
                            <button type="button" class="like-main-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${esc(user.id)}')" title="${liked ? 'Retirer le j’aime' : 'Aimer'}" aria-label="${liked ? 'Retirer le j’aime' : 'Aimer'}" aria-pressed="${liked}">${heartIcon()} <span>${user.stats?.likesTotal || 0}</span></button>
                        </div>` : ''}
                        <div class="hero-profile">
                            <div class="avatar-wrap" style="border-color:${esc(theme.border)}">
                                <img src="${esc(user.avatar || '/assets/images/logo.jpg')}" alt="">
                            </div>
                            <h1 class="profile-name" style="color:${esc(theme.text)}">${name} ${rank}</h1>
                            <p class="profile-subtitle">${esc(user.subtitle || 'Aucune description')}</p>
                            <div class="profile-stats">
                                <span>${user.stats?.visitsTotal || 0} visites</span>
                                <span>${user.stats?.likesTotal || 0} j’aime</span>
                            </div>
                        </div>
                        <div class="profile-section" style="background:${esc(theme.panelBg)};margin-top:24px">
                            <h3>Liens</h3>
                            <div class="link-list">
                                ${!(user.links || []).length ? '<p class="me-hint">Aucun lien pour le moment.</p>' : ''}
                                ${(user.links || []).map((link) => {
                                    const href = safeHref(link.valeur);
                                    const action = link.type === 'url' && href
                                        ? `<a class="link-action btn btn-outline" href="${esc(href)}" target="_blank" rel="noopener">Ouvrir</a>`
                                        : `<button type="button" class="link-action btn btn-outline" onclick="copierTexte('${esc(link.valeur || '')}', this)">Copier</button>`;
                                    return `<div class="link-item">
                                        <div class="link-left">
                                            <span class="link-icon">${esc(networkLabel(link.reseau))}</span>
                                            <div class="link-texts">
                                                <strong>${esc(link.display_name || link.titre || 'Lien')}</strong>
                                                <span>${esc(link.sousTitre || '')}</span>
                                            </div>
                                        </div>
                                        ${action}
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        async function bumpMe() {
            try {
                const res = await fetch('/api/discord/me/trigger-bump', { method: 'POST' });
                const data = await res.json();
                showModal('Bump', data.message || 'Profil mis en avant un moment.', 'Fermer', null);
            } catch {
                showModal('Erreur', 'Le bump a échoué.', 'Fermer', null);
            }
        }

        function renderEdit() {
            if (!MonProfil) return;
            const maxLinks = 4 + (Ranks[MonProfil.rank]?.bonusLinks || 0) + MonProfil.extraLinkSlots;
            const featuredLive = MonProfil.featuredUntil && MonProfil.featuredUntil > Date.now();
            viewContainer.innerHTML = `
                <div class="panel">
                    <div class="me-edit-head" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
                        <div>
                            <button type="button" class="btn btn-outline" onclick="navigate('profile','me')">Retour au profil</button>
                            <h2 style="margin:12px 0 0">Modifier le profil</h2>
                        </div>
                        <span class="rank-badge ${Ranks[MonProfil.rank].class}">${esc(Ranks[MonProfil.rank].name)}</span>
                    </div>

                    <div class="me-preview">
                        <div class="me-banner-frame" id="liveBanner" style="${bannerStyle(MonProfil)}"></div>
                        <div class="me-preview-hero">
                            <img src="${esc(MonProfil.avatar || '/assets/images/logo.jpg')}" alt="">
                            <div>
                                <strong id="liveName">${esc(displayName(MonProfil))}</strong>
                                <p class="me-hint" id="liveSub">${esc(MonProfil.subtitle || '')}</p>
                            </div>
                        </div>
                    </div>

                    <div class="me-section">
                        <h3>Bannière</h3>
                        <p class="me-hint">Choisissez un fichier. JPEG, PNG, WebP ou GIF — 3 Mo max. Format large recommandé.</p>
                        <div class="me-banner-pick" style="margin-top:10px">
                            <div class="me-banner-preview" id="bannerPreview" style="${bannerStyle(MonProfil)}"></div>
                            <div class="me-banner-actions">
                                <label class="btn btn-outline">
                                    Choisir un fichier
                                    <input type="file" id="bannerFile" accept="image/jpeg,image/png,image/webp,image/gif">
                                </label>
                                <button type="button" class="btn btn-outline" id="bannerClear">Retirer</button>
                            </div>
                            <p class="me-status" id="bannerStatus"></p>
                        </div>
                    </div>

                    <div class="me-section">
                        <h3>Présentation</h3>
                        <div class="form-group">
                            <label for="editName">Nom affiché</label>
                            <input type="text" id="editName" class="form-control" maxlength="40" value="${esc(MonProfil.name || MonProfil.username || '')}">
                        </div>
                        <div class="form-group">
                            <label for="editSub">Description</label>
                            <input type="text" id="editSub" class="form-control" maxlength="160" value="${esc(MonProfil.subtitle || '')}">
                        </div>
                    </div>

                    <div class="me-section">
                        <h3>Mise en avant</h3>
                        <p class="me-hint">${featuredLive ? `À la une jusqu’au ${new Date(MonProfil.featuredUntil).toLocaleDateString('fr-FR')}.` : 'Apparaissez en priorité dans Tous et dans l’onglet À la une.'}</p>
                        <div class="me-toolbar" style="margin-top:10px">
                            <button type="button" class="btn btn-outline" onclick="buyFeatured(10, 1)">24 h — 10 Kr</button>
                            <button type="button" class="btn btn-outline" onclick="buyFeatured(35, 7)">7 jours — 35 Kr</button>
                            <button type="button" class="btn btn-outline" onclick="buyFeatured(100, 30)">30 jours — 100 Kr</button>
                        </div>
                        <label class="me-hint" style="display:flex;gap:8px;align-items:center;margin-top:12px">
                            <input type="checkbox" id="autoRenewFeatured" ${MonProfil.autoRenewFeatured ? 'checked' : ''} onchange="toggleAutoRenew(this.checked)">
                            Renouveler automatiquement
                        </label>
                    </div>

                    <div class="me-section">
                        <h3>Adresse</h3>
                        <p class="me-hint">Réservez synkrone.app/votre-nom — 200 Kr, une fois.</p>
                        <div class="form-group" style="flex-direction:row;align-items:center;gap:10px;margin-top:10px">
                            <span class="me-hint">synkrone.app/</span>
                            <input type="text" id="editCustomUrl" class="form-control" value="${esc(MonProfil.customUrl || '')}" placeholder="mon-nom" ${MonProfil.customUrl ? 'disabled' : ''}>
                            ${MonProfil.customUrl
                                ? '<span class="me-hint">Réservée</span>'
                                : '<button type="button" class="btn btn-outline" onclick="buyCustomUrl()">Réserver</button>'}
                        </div>
                    </div>

                    <div class="me-section">
                        <h3>Visibilité</h3>
                        <div class="me-privacy" style="margin-top:10px">
                            <label><span><input type="radio" name="privacy" value="private" onchange="savePrivacyLocally()" ${MonProfil.privacy === 'private' ? 'checked' : ''}> Privé</span></label>
                            <label>
                                <span><input type="radio" name="privacy" value="unlisted" onchange="savePrivacyLocally()" ${MonProfil.privacy === 'unlisted' ? 'checked' : ''} ${MonProfil.unlockedPrivacies.includes('unlisted') ? '' : 'disabled'}> Non répertorié</span>
                                ${MonProfil.unlockedPrivacies.includes('unlisted') ? '<span class="me-hint">Débloqué</span>' : `<button type="button" class="btn btn-outline" onclick="buyPrivacy('unlisted')">30 Kr</button>`}
                            </label>
                            <label>
                                <span><input type="radio" name="privacy" value="public" onchange="savePrivacyLocally()" ${MonProfil.privacy === 'public' ? 'checked' : ''} ${MonProfil.unlockedPrivacies.includes('public') ? '' : 'disabled'}> Public</span>
                                ${MonProfil.unlockedPrivacies.includes('public') ? '<span class="me-hint">Débloqué</span>' : `<button type="button" class="btn btn-outline" onclick="buyPrivacy('public')">${MonProfil.unlockedPrivacies.includes('unlisted') ? '30' : '60'} Kr</button>`}
                            </label>
                        </div>
                    </div>

                    <div class="me-section">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
                            <h3>Liens (${MonProfil.links.length} / ${maxLinks})</h3>
                            <button type="button" class="btn btn-outline" onclick="buyLinkSlot()">+1 emplacement — 10 Kr</button>
                        </div>
                        <div id="linksEditorContainer" class="link-edit-list"></div>
                        ${MonProfil.links.length < maxLinks
                            ? '<button type="button" class="btn btn-outline" style="margin-top:12px;width:100%" onclick="addEmptyLink()">Ajouter un lien</button>'
                            : '<p class="me-hint" style="margin-top:10px">Limite atteinte. Ajoutez un emplacement.</p>'}
                    </div>

                    <div class="me-section">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
                            <h3>Thème</h3>
                            ${MonProfil.hasCustomization
                                ? '<span class="me-hint">Débloqué</span>'
                                : '<button type="button" class="btn btn-success" onclick="buyCustomization()">Débloquer — 50 Kr</button>'}
                        </div>
                        <div style="opacity:${MonProfil.hasCustomization ? '1' : '0.5'};pointer-events:${MonProfil.hasCustomization ? 'all' : 'none'};margin-top:12px">
                            <label class="me-hint" style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
                                <input type="checkbox" id="themeActive" ${MonProfil.customTheme.active ? 'checked' : ''}> Activer le thème
                            </label>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                                <div class="color-picker-wrap"><input type="color" id="themeBg" class="color-picker" value="${esc(MonProfil.customTheme.bg || '#eef0ea')}"><label>Fond</label></div>
                                <div class="color-picker-wrap"><input type="color" id="themeText" class="color-picker" value="${esc(MonProfil.customTheme.text || '#1b211e')}"><label>Texte</label></div>
                                <div class="color-picker-wrap"><input type="color" id="themeBorder" class="color-picker" value="${esc(MonProfil.customTheme.border || '#3f6b52')}"><label>Avatar</label></div>
                                <div class="color-picker-wrap"><input type="color" id="themePanelBg" class="color-picker" value="${esc((MonProfil.customTheme.panelBg || '#ffffff').startsWith('#') ? MonProfil.customTheme.panelBg : '#ffffff')}"><label>Rubriques</label></div>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top:24px;text-align:right">
                        <button type="button" class="btn btn-primary" onclick="saveFullProfile()">Enregistrer</button>
                    </div>
                </div>
            `;
            renderLinksEditor();
            bindBannerPicker();
            bindLivePreview();
        }

        function setBannerPreview(url) {
            const style = url ? `background-image:url('${esc(url)}')` : '';
            const preview = document.getElementById('bannerPreview');
            const live = document.getElementById('liveBanner');
            if (preview) preview.setAttribute('style', style);
            if (live) live.setAttribute('style', style);
        }

        function bindLivePreview() {
            const name = document.getElementById('editName');
            const sub = document.getElementById('editSub');
            const liveName = document.getElementById('liveName');
            const liveSub = document.getElementById('liveSub');
            name?.addEventListener('input', () => { if (liveName) liveName.textContent = name.value || displayName(MonProfil); });
            sub?.addEventListener('input', () => { if (liveSub) liveSub.textContent = sub.value; });
        }

        function bindBannerPicker() {
            const input = document.getElementById('bannerFile');
            const clear = document.getElementById('bannerClear');
            const status = document.getElementById('bannerStatus');
            input?.addEventListener('change', async () => {
                const file = input.files?.[0];
                input.value = '';
                if (!file || bannerBusy) return;
                if (file.size > 3 * 1024 * 1024) {
                    status.textContent = 'Image trop lourde (3 Mo max).';
                    return;
                }
                bannerBusy = true;
                status.textContent = 'Envoi…';
                const dataUrl = await readFileAsDataUrl(file).catch(() => null);
                if (!dataUrl) {
                    bannerBusy = false;
                    status.textContent = 'Lecture impossible.';
                    return;
                }
                setBannerPreview(dataUrl);
                try {
                    const res = await fetch('/api/me/banner', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: dataUrl })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.message || 'Envoi impossible.');
                    MonProfil.banner = data.banner;
                    MonProfil.bannerCustom = true;
                    setBannerPreview(data.banner);
                    status.textContent = 'Bannière enregistrée.';
                } catch (err) {
                    status.textContent = err.message;
                    setBannerPreview(bannerOf(MonProfil));
                } finally {
                    bannerBusy = false;
                }
            });
            clear?.addEventListener('click', async () => {
                if (bannerBusy) return;
                bannerBusy = true;
                status.textContent = 'Retrait…';
                try {
                    const res = await fetch('/api/me/banner', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ clear: true })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.message || 'Impossible de retirer.');
                    MonProfil.banner = '';
                    MonProfil.bannerCustom = false;
                    setBannerPreview('');
                    status.textContent = 'Bannière retirée.';
                } catch (err) {
                    status.textContent = err.message;
                } finally {
                    bannerBusy = false;
                }
            });
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ''));
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        window.buyFeatured = function (cost, days) {
            showModal('Mise en avant', `Payer <b>${cost} Krônes</b> pour ${days} jour(s) ?`, 'Acheter', async () => {
                try {
                    const res = await fetch('/api/discord/me/buy-featured', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            days,
                            cost,
                            autoRenew: document.getElementById('autoRenewFeatured')?.checked || false
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) return showModal('Erreur', data.error || 'Achat impossible.', 'Fermer', null);
                    MonProfil.krones = data.krone;
                    MonProfil.featuredUntil = data.featuredUntil;
                    MonProfil.featured = true;
                    syncUserToParent();
                    renderEdit();
                    showModal('C’est fait', 'Votre profil est à la une.', 'OK', null);
                } catch {
                    showModal('Erreur', 'Problème réseau.', 'Fermer', null);
                }
            });
        };

        window.toggleAutoRenew = function (checked) {
            MonProfil.autoRenewFeatured = checked;
            fetch('/api/me/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ autoRenewFeatured: checked })
            });
        };

        window.buyCustomUrl = function () {
            const input = document.getElementById('editCustomUrl').value.trim().toLowerCase();
            if (!input) return showModal('Adresse', 'Entrez un nom.', 'Fermer', null);
            if (!/^[a-z0-9-]+$/.test(input)) return showModal('Adresse', 'Lettres, chiffres et tirets seulement.', 'Fermer', null);
            showModal('Réserver', `Réserver <b>synkrone.app/${esc(input)}</b> pour 200 Krônes ?`, 'Acheter', async () => {
                const res = await fetch('/api/me/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customUrl: input })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) return showModal('Erreur', data.message || 'Nom indisponible.', 'Fermer', null);
                MonProfil.customUrl = input;
                syncUserToParent();
                renderEdit();
            });
        };

        function renderLinksEditor() {
            const container = document.getElementById('linksEditorContainer');
            if (!container) return;
            container.innerHTML = MonProfil.links.map((link, index) => `
                <div class="link-edit-item">
                    <select class="form-control" style="width:140px" onchange="updateLinkData(${index}, 'reseau', this.value); renderEdit();">
                        ${NETWORKS.map((item) => `<option value="${item.id}" ${link.reseau === item.id ? 'selected' : ''}>${item.label}</option>`).join('')}
                    </select>
                    <input type="text" class="form-control" style="flex:1;min-width:120px" placeholder="Nom" value="${esc(link.display_name || link.titre || '')}" oninput="updateLinkData(${index}, 'display_name', this.value); updateLinkData(${index}, 'titre', this.value)">
                    <input type="text" class="form-control" style="flex:1;min-width:120px" placeholder="Sous-titre" value="${esc(link.sousTitre || '')}" oninput="updateLinkData(${index}, 'sousTitre', this.value)">
                    <input type="text" class="form-control" style="flex:1.4;min-width:150px" placeholder="https://…" value="${esc(link.valeur || '')}" oninput="updateLinkData(${index}, 'valeur', this.value)">
                    <select class="form-control" style="width:100px" onchange="updateLinkData(${index}, 'type', this.value)">
                        <option value="url" ${link.type === 'url' ? 'selected' : ''}>Lien</option>
                        <option value="copy" ${link.type === 'copy' ? 'selected' : ''}>Copie</option>
                    </select>
                    <button type="button" class="btn btn-outline" onclick="removeLink(${index})">Retirer</button>
                </div>
            `).join('');
        }

        window.updateLinkData = function (index, field, value) { MonProfil.links[index][field] = value; };
        window.removeLink = function (index) { MonProfil.links.splice(index, 1); renderEdit(); };
        window.addEmptyLink = function () {
            MonProfil.links.push({ reseau: 'custom', titre: '', sousTitre: '', valeur: '', type: 'url' });
            renderEdit();
        };
        window.savePrivacyLocally = function () {
            const el = document.querySelector('input[name="privacy"]:checked');
            if (el) MonProfil.privacy = el.value;
        };

        window.saveFullProfile = async function () {
            const payload = {
                name: document.getElementById('editName').value.trim(),
                subtitle: document.getElementById('editSub').value,
                banner: MonProfil.banner || '',
                privacy: MonProfil.privacy,
                links: MonProfil.links
            };
            if (MonProfil.hasCustomization) {
                payload.customTheme = {
                    active: document.getElementById('themeActive').checked,
                    bg: document.getElementById('themeBg').value,
                    text: document.getElementById('themeText').value,
                    border: document.getElementById('themeBorder').value,
                    panelBg: document.getElementById('themePanelBg').value
                };
            }
            try {
                const res = await fetch('/api/me/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('La sauvegarde a échoué.');
                MonProfil = hydrateMe({ ...MonProfil, ...payload });
                showModal('Enregistré', 'Votre profil a été mis à jour.', 'Voir le profil', () => navigate('profile', 'me'));
            } catch (err) {
                showModal('Erreur', err.message, 'Fermer', null);
            }
        };

        window.buyPrivacy = function (target) {
            const cost = target === 'unlisted' ? 30 : (MonProfil.unlockedPrivacies.includes('unlisted') ? 30 : 60);
            showModal('Visibilité', `Débloquer « ${target} » pour ${cost} Krônes ?`, 'Acheter', async () => {
                const unlocked = [...MonProfil.unlockedPrivacies];
                if (target === 'public' && !unlocked.includes('unlisted')) unlocked.push('unlisted');
                unlocked.push(target);
                const res = await fetch('/api/me/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ unlockedPrivacies: unlocked, privacy: target, krone: MonProfil.krones - cost })
                });
                if (!res.ok) return showModal('Erreur', 'Fonds insuffisants ou erreur.', 'Fermer', null);
                MonProfil.krones -= cost;
                MonProfil.unlockedPrivacies = unlocked;
                MonProfil.privacy = target;
                syncUserToParent();
                renderEdit();
            });
        };

        window.buyLinkSlot = function () {
            showModal('Emplacement', 'Ajouter un lien pour 10 Krônes ?', 'Acheter', async () => {
                const res = await fetch('/api/me/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ extraLinkSlots: MonProfil.extraLinkSlots + 1, krone: MonProfil.krones - 10 })
                });
                if (!res.ok) return showModal('Erreur', 'Fonds insuffisants.', 'Fermer', null);
                MonProfil.krones -= 10;
                MonProfil.extraLinkSlots += 1;
                syncUserToParent();
                renderEdit();
            });
        };

        window.buyCustomization = function () {
            showModal('Thème', 'Débloquer les couleurs pour 50 Krônes ?', 'Acheter', async () => {
                const res = await fetch('/api/me/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hasCustomization: true, krone: MonProfil.krones - 50 })
                });
                if (!res.ok) return showModal('Erreur', 'Fonds insuffisants.', 'Fermer', null);
                MonProfil.krones -= 50;
                MonProfil.hasCustomization = true;
                syncUserToParent();
                renderEdit();
            });
        };

        window.copierTexte = function (texte, btn) {
            navigator.clipboard.writeText(texte).then(() => {
                const old = btn.textContent;
                btn.textContent = 'Copié';
                setTimeout(() => { btn.textContent = old; }, 1400);
            });
        };

        window.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
