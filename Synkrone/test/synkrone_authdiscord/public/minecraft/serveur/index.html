<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft - Serveur</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111314;
            color: #d1cdc7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .server-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #111314;
        }
    </style>
    <link rel="stylesheet" href="/design/synkrone.css">
</head>
<body>
    <iframe
        class="server-frame"
        src="https://www.cantale.world"
        title="Serveur Cantale"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
    ></iframe>
</body>
</html>
