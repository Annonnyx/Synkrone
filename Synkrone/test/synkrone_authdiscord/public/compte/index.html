<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="/assets/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkrone — Compte</title>
    <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg">
    <link rel="stylesheet" href="/assets/accueil.css">
    <link rel="stylesheet" href="/design/synkrone.css">
    <style>
        .compte { padding: 40px 0 80px; }
        .compte h1 { font-family: var(--sk-serif, "Zilla Slab", Georgia, serif); font-size: 2.4rem; margin: 0 0 .4rem; }
        .compte .lede { color: var(--sk-muted, var(--hall-mute)); max-width: 52ch; margin: 0 0 2rem; }
        .compte-grid { display: grid; gap: 16px; }
        @media (min-width: 840px) { .compte-grid { grid-template-columns: 1fr 1fr; } }
        .compte-card {
            border: 1px solid var(--sk-border, var(--hall-line));
            background: var(--sk-surface, var(--blanc));
            padding: 18px 20px;
        }
        .compte-card h2 { font-family: var(--sk-serif, "Zilla Slab", Georgia, serif); font-size: 1.35rem; margin: 0 0 12px; }
        .compte-card p, .compte-card li { color: var(--sk-muted, var(--hall-mute)); font-size: .95rem; }
        .compte-card ul { margin: 0; padding-left: 1.1rem; }
        .compte-stat { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--sk-border, var(--hall-line)); }
        .compte-stat:last-child { border-bottom: 0; }
        .compte-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .compte-actions a, .compte-login {
            display: inline-block; padding: .7rem 1rem; border: 1px solid var(--sk-border, var(--hall-line));
            color: inherit; text-decoration: none; font-weight: 600;
        }
        .err { color: var(--sk-danger, #8f2d2d); }
    </style>
</head>
<body>
    <section class="band compte">
        <div class="band-inner">
            <p class="sect-id">Compte</p>
            <h1>Ton espace</h1>
            <p class="lede">Rôles du serveur support, services hébergés, Krônes et serveurs où un bot Synkrone est présent.</p>
            <p id="status" class="err" hidden></p>
            <div id="root" class="compte-grid"></div>
        </div>
    </section>
    <script>
        const root = document.getElementById('root');
        const status = document.getElementById('status');
        function esc(v) {
            return String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }
        (async () => {
            const res = await fetch('/api/compte', { credentials: 'same-origin' });
            const data = await res.json();
            if (!res.ok) {
                root.innerHTML = `<p>Connecte-toi pour voir ton compte.</p><p class="compte-actions"><a href="${esc(data.loginUrl || '/login?returnTo=/compte')}" target="_top">Se connecter</a></p>`;
                return;
            }
            const roles = (data.support?.roles || []).map((r) => `<li>${esc(r.name)}</li>`).join('') || '<li>Aucun rôle support lu.</li>';
            let servicesLabel = '<li>Aucun service lié au panel.</li>';
            if (data.servicesError) {
                servicesLabel = `<li>Impossible de lire le panel : ${esc(data.servicesError)}</li>`;
            } else if ((data.services || []).length) {
                servicesLabel = (data.services || []).map((s) => `<li>${esc(s.name)} — ${esc(s.state || s.type)}</li>`).join('');
            } else if (data.linkedPanel === false && data.user && data.user.discordId) {
                servicesLabel = '<li>Compte Discord du site non lié au panel. Ouvre Hébergement et connecte-toi (ou lie Discord dans Compte) avec le même Discord que celui du bot.</li>';
            }
            const guilds = (data.guilds || []).map((g) => `<li><a href="${esc(g.href)}" target="_top">${esc(g.name)}</a> · ${esc(g.bot)}</li>`).join('') || '<li>Passe par /config sur Discord pour ouvrir un serveur.</li>';
            root.innerHTML = `
                <article class="compte-card">
                    <h2>${esc(data.user.username)}</h2>
                    <p>${data.user.discordId ? 'Compte Discord.' : 'Connecte Discord pour les rôles support et les serveurs.'}</p>
                    <h2>Rôles support</h2>
                    <ul>${roles}</ul>
                </article>
                <article class="compte-card">
                    <h2>Krônes</h2>
                    <div class="compte-stat"><span>Solde</span><strong>${esc(data.krones.balance)} ₭</strong></div>
                    <div class="compte-stat"><span>Dépensé au total</span><strong>${esc(data.krones.spentTotal)} ₭</strong></div>
                    <div class="compte-stat"><span>Ce mois</span><strong>${esc(data.krones.spentMonth)} ₭</strong></div>
                    <div class="compte-stat"><span>Rang</span><strong>${esc(data.krones.plan)}</strong></div>
                    <p class="compte-actions"><a href="/krones">Portefeuille</a></p>
                </article>
                <article class="compte-card">
                    <h2>Services</h2>
                    <ul>${servicesLabel}</ul>
                    <p class="compte-actions"><a href="${esc(data.panelUrl)}" target="_top">Hébergement</a></p>
                </article>
                <article class="compte-card">
                    <h2>Serveurs</h2>
                    <ul>${guilds}</ul>
                    <p>Les bots officiels se configurent aussi depuis /config dans Discord, puis Configurer sur le site.</p>
                </article>
            `;
        })().catch((err) => {
            status.hidden = false;
            status.textContent = err.message || 'Compte indisponible.';
        });
    </script>
</body>
</html>
