<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="/assets/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets — Synkrone</title>
    <link rel="stylesheet" href="/design/synkrone.css">
    <link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">
<main class="admin-page">
    <header class="admin-head">
        <div>
            <h1>Tickets</h1>
            <p class="admin-lead">Salons Discord de la catégorie support. Le fil se lit et se répond sur Discord.</p>
        </div>
    </header>
    <section class="admin-card">
        <p class="status" id="status"></p>
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead><tr><th>Salon</th><th>Ouvert</th><th></th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </section>
</main>
<script>
(async () => {
    const status = document.getElementById('status');
    const res = await fetch('/api/admin/tickets');
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { status.textContent = data.error || 'Impossible de lire les tickets'; return; }
    if (!data.configured) { status.textContent = data.hint || 'Bot Discord non configuré'; return; }
    const tickets = data.tickets || [];
    status.textContent = data.categoryId
        ? `${tickets.length} ticket(s) dans la catégorie`
        : `${tickets.length} salon(s) texte (pas de catégorie ticket définie)`;
    document.getElementById('rows').innerHTML = tickets.map((t) => `
        <tr>
            <td>#${t.name}<br><span class="admin-meta">${t.topic || ''}</span></td>
            <td>${t.createdAt ? new Date(t.createdAt).toLocaleString('fr-FR') : '—'}</td>
            <td><a class="sk-btn ghost" href="${t.url}" target="_blank" rel="noreferrer">Ouvrir</a></td>
        </tr>
    `).join('') || '<tr><td colspan="3">Aucun ticket ouvert.</td></tr>';
})();
</script>
</body>
</html>
