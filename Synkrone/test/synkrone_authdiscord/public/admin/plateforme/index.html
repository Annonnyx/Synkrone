<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme</title>
    <link rel="stylesheet" href="../admin.css">
</head>
<body>
<main>
    <h1>Plateforme</h1>
    <p class="lead">Couper Minecraft, plafonner CPU / RAM / stockage, et poser des réductions limitées dans le temps.</p>
    <form id="form">
        <label><input type="checkbox" id="minecraftEnabled"> Autoriser la création de serveurs Minecraft</label>
        <div class="grid-2">
            <label>CPU max global (millicores)<input type="number" id="maxCpuMillicores" min="100" max="16000"></label>
            <label>RAM max globale (Mo)<input type="number" id="maxMemoryMb" min="64" max="65536"></label>
            <label>Stockage max global (Mo)<input type="number" id="maxStorageMb" min="512" max="204800"></label>
        </div>
        <h2>Plafonds par type</h2>
        <div class="grid-2" id="types"></div>
        <div class="row"><button type="submit">Enregistrer les plafonds</button></div>
        <p class="status" id="status"></p>
    </form>

    <h2>Réductions temporaires</h2>
    <p class="lead">Un pourcentage, une durée, et ce que ça touche : bots, sites, Minecraft, RAM, CPU, stockage, ou tout.</p>
    <form id="promo-form">
        <div class="grid-2">
            <label>Libellé<input id="promo-label" maxlength="80" placeholder="Promo de rentrée"></label>
            <label>Réduction (%)<input id="promo-percent" type="number" min="1" max="100" value="20"></label>
            <label>Durée<input id="promo-duration" type="number" min="1" value="7"></label>
            <label>Unité
                <select id="promo-unit">
                    <option value="hours">Heures</option>
                    <option value="days" selected>Jours</option>
                    <option value="weeks">Semaines</option>
                </select>
            </label>
        </div>
        <div class="row" id="promo-targets"></div>
        <div class="row"><button type="submit">Ajouter la réduction</button></div>
        <p class="status" id="promo-status"></p>
    </form>
    <table>
        <thead>
            <tr>
                <th>Libellé</th>
                <th>%</th>
                <th>Cible</th>
                <th>Fin</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="promo-rows"></tbody>
    </table>
</main>
<script>
const types = ['discord', 'minecraft', 'web'];
const TARGETS = [
    { id: 'discord', label: 'Bots' },
    { id: 'minecraft', label: 'Minecraft' },
    { id: 'web', label: 'Sites' },
    { id: 'ram', label: 'RAM' },
    { id: 'cpu', label: 'CPU' },
    { id: 'storage', label: 'Stockage' },
    { id: 'all', label: 'Tout' }
];
const TARGET_LABEL = Object.fromEntries(TARGETS.map((item) => [item.id, item.label]));
let platform = { discounts: [] };

function field(id, label) {
    return `<label>${label}<input type="number" id="${id}" min="64"></label>`;
}
document.getElementById('types').innerHTML = types.map((t) => `
    <div>
        <strong>${t}</strong>
        ${field(`${t}-cpu`, 'CPU millicores')}
        ${field(`${t}-ram`, 'RAM Mo')}
        ${field(`${t}-disk`, 'Stockage Mo')}
    </div>
`).join('');
document.getElementById('promo-targets').innerHTML = TARGETS.map((item) => `
    <label style="display:flex;align-items:center;gap:.4rem;grid-template-columns:none;">
        <input type="checkbox" name="promo-target" value="${item.id}"> ${item.label}
    </label>
`).join('');

function fill(data) {
    platform = data;
    document.getElementById('minecraftEnabled').checked = data.minecraftEnabled !== false;
    document.getElementById('maxCpuMillicores').value = data.maxCpuMillicores;
    document.getElementById('maxMemoryMb').value = data.maxMemoryMb;
    document.getElementById('maxStorageMb').value = data.maxStorageMb;
    for (const t of types) {
        const row = data.limits?.[t] || {};
        document.getElementById(`${t}-cpu`).value = row.cpuMillicores || '';
        document.getElementById(`${t}-ram`).value = row.memoryMb || '';
        document.getElementById(`${t}-disk`).value = row.storageMb || '';
    }
    renderPromos();
}

function renderPromos() {
    const now = Date.now();
    const rows = Array.isArray(platform.discounts) ? platform.discounts : [];
    document.getElementById('promo-rows').innerHTML = rows.length ? rows.map((row) => {
        const live = row.enabled !== false && row.startsAt <= now && now < row.endsAt;
        const when = new Date(row.endsAt).toLocaleString('fr-FR');
        const targets = (row.targets || []).map((id) => TARGET_LABEL[id] || id).join(', ');
        return `<tr>
            <td>${row.label || 'Promo'}${live ? '' : ' (off)'}</td>
            <td>${row.percent} %</td>
            <td>${targets}</td>
            <td>${when}</td>
            <td>
                <button type="button" class="ghost" data-toggle="${row.id}">${row.enabled === false ? 'Activer' : 'Pause'}</button>
                <button type="button" class="danger" data-del="${row.id}">Retirer</button>
            </td>
        </tr>`;
    }).join('') : '<tr><td colspan="5">Aucune réduction.</td></tr>';
}

async function save(patch) {
    const res = await fetch('/api/admin/platform', {
        method: 'PATCH',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(patch)
    });
    if (!res.ok) throw new Error('Échec.');
    fill(await res.json());
}

async function load() {
    const res = await fetch('/api/admin/platform');
    if (!res.ok) throw new Error('Lecture impossible');
    fill(await res.json());
}

document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('status');
    const limits = {};
    for (const t of types) {
        limits[t] = {
            cpuMillicores: Number(document.getElementById(`${t}-cpu`).value),
            memoryMb: Number(document.getElementById(`${t}-ram`).value),
            storageMb: Number(document.getElementById(`${t}-disk`).value)
        };
    }
    try {
        await save({
            minecraftEnabled: document.getElementById('minecraftEnabled').checked,
            maxCpuMillicores: Number(document.getElementById('maxCpuMillicores').value),
            maxMemoryMb: Number(document.getElementById('maxMemoryMb').value),
            maxStorageMb: Number(document.getElementById('maxStorageMb').value),
            limits
        });
        status.textContent = 'Enregistré.';
    } catch (err) {
        status.textContent = err.message;
    }
});

document.getElementById('promo-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('promo-status');
    const targets = [...document.querySelectorAll('input[name="promo-target"]:checked')].map((el) => el.value);
    const duration = Number(document.getElementById('promo-duration').value);
    const unit = document.getElementById('promo-unit').value;
    const ms = duration * (unit === 'hours' ? 3600000 : unit === 'weeks' ? 7 * 86400000 : 86400000);
    if (!targets.length) {
        status.textContent = 'Choisissez au moins une cible.';
        return;
    }
    if (!Number.isFinite(duration) || duration <= 0) {
        status.textContent = 'Durée invalide.';
        return;
    }
    const now = Date.now();
    const next = {
        id: `promo-${now.toString(36)}`,
        label: document.getElementById('promo-label').value.trim() || 'Promo',
        targets,
        percent: Number(document.getElementById('promo-percent').value),
        startsAt: now,
        endsAt: now + ms,
        enabled: true
    };
    try {
        await save({ discounts: [...(platform.discounts || []), next] });
        status.textContent = 'Réduction ajoutée.';
        document.getElementById('promo-label').value = '';
    } catch (err) {
        status.textContent = err.message;
    }
});

document.getElementById('promo-rows').addEventListener('click', async (event) => {
    const toggle = event.target.getAttribute('data-toggle');
    const del = event.target.getAttribute('data-del');
    const rows = [...(platform.discounts || [])];
    if (toggle) {
        await save({
            discounts: rows.map((row) => row.id === toggle ? { ...row, enabled: row.enabled === false } : row)
        });
    }
    if (del) {
        await save({ discounts: rows.filter((row) => row.id !== del) });
    }
});

load().catch((err) => { document.getElementById('status').textContent = err.message; });
</script>
</body>
</html>
