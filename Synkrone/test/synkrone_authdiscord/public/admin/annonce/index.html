<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="/assets/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonces — Synkrone</title>
    <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpg">
    <link rel="stylesheet" href="/design/synkrone.css">
    <link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-body">
    <main class="admin-page">
        <section class="admin-card">
            <div class="section-header">
                <div>
                    <h1>Annonces</h1>
                    <p class="admin-lead">Les publications ici alimentent l’accueil.</p>
                </div>
                <div class="btn-row">
                    <button class="sk-btn ghost" type="button" onclick="openTypesModal()">Gérer les types</button>
                    <span id="type-count" class="config-count">0 type</span>
                </div>
            </div>

            <div class="field">
                <label class="label" for="annonce-title">Titre</label>
                <input id="annonce-title" type="text" maxlength="100" placeholder="Ex : Cantale ouvre ses factions ce vendredi">
            </div>

            <div class="field">
                <label class="label" for="annonce-scope">Univers</label>
                <select id="annonce-scope"></select>
            </div>

            <div class="field">
                <label class="label" for="annonce-type">Types</label>
                <div class="type-picker">
                    <select id="annonce-type"></select>
                    <button class="sk-btn" type="button" onclick="addTypeToAnnouncement()">Ajouter l'étiquette</button>
                </div>
                <div id="selected-types" class="type-list"></div>
            </div>

            <div class="field">
                <label class="label" for="annonce-summary">Résumé</label>
                <textarea id="annonce-summary" maxlength="240" placeholder="Ex : Ouverture vendredi 20h, IP et règles à retenir… (240 max)"></textarea>
            </div>

            <div class="field">
                <label class="label" for="annonce-content">Contenu détaillé</label>
                <textarea id="annonce-content" maxlength="2000" placeholder="Ex : Déroulé, dates, liens utiles, ce qui change pour les joueurs…"></textarea>
            </div>

            <div class="field">
                <label class="label"><input type="checkbox" id="annonce-published" checked> Publier tout de suite</label>
            </div>
            <div class="btn-row">
                <button class="sk-btn-primary" type="button" onclick="createAnnouncement()">Enregistrer</button>
            </div>
        </section>

        <section class="admin-card">
            <h2>Annonces</h2>
            <div id="annonce-list" class="list"></div>
        </section>
        <section class="admin-card">
            <h2>Avis opt-in</h2>
            <p class="admin-lead">Extraits proposés depuis Contact. Publiez seulement ce qui a été accepté.</p>
            <div id="avis-list" class="list"></div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <div id="types-modal" class="modal" aria-hidden="true">
        <article class="modal-content">
            <div class="modal-top">
                <h2 class="modal-title">Types d'annonce</h2>
                <button class="sk-btn ghost" type="button" onclick="closeTypesModal()">Fermer</button>
            </div>
            <div class="field">
                <label class="label" for="new-type">Nouveau type</label>
                <input id="new-type" type="text" placeholder="Ex : maintenance, event, boutique">
            </div>
            <div class="btn-row">
                <button class="sk-btn-primary" type="button" onclick="addType()">Ajouter le type</button>
            </div>
            <div id="type-list" class="type-list"></div>
        </article>
    </div>

    <script>
        const ALLOWED_SCOPES = ['synkrone', 'bots', 'bump', 'me', 'dashbot', 'serveur', 'modpack'];
        const DEFAULT_TYPES = ['maj', 'nerf', 'event', 'boutique'];

        let toastTimer;
        let selectedTypesForAnnouncement = [];
        let typeCache = [...DEFAULT_TYPES];
        let itemCache = [];
        let editingId = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        function normalizeType(value) {
            return value
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9-]/g, '');
        }

        function loadTypes() {
            return typeCache.length ? typeCache : [...DEFAULT_TYPES];
        }

        async function saveTypes(types) {
            typeCache = types;
            await fetch('/api/announcement-types', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ types })
            });
        }

        function loadAnnouncements() {
            return itemCache;
        }

        async function refreshAnnouncements() {
            const res = await fetch('/api/announcements?admin=1');
            const data = await res.json();
            typeCache = Array.isArray(data.types) && data.types.length ? data.types : [...DEFAULT_TYPES];
            itemCache = Array.isArray(data.items) ? data.items : [];
        }

        function formatLabel(value) {
            if (!value) return '';
            const normalized = String(value).replaceAll('-', ' ');
            return normalized.charAt(0).toUpperCase() + normalized.slice(1);
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 2600);
        }

        function normalizeAnnouncementTypes(item) {
            const rawTypes = Array.isArray(item.types) && item.types.length
                ? item.types
                : [item.type].filter(Boolean);
            const cleaned = rawTypes
                .map((entry) => normalizeType(String(entry || '')))
                .filter(Boolean);
            return [...new Set(cleaned)];
        }

        function renderTypeList() {
            const list = document.getElementById('type-list');
            const typeSelect = document.getElementById('annonce-type');
            const typeCount = document.getElementById('type-count');
            const types = loadTypes();

            list.innerHTML = '';
            typeSelect.innerHTML = '';

            types.forEach((type) => {
                const pill = document.createElement('div');
                pill.className = 'type-pill';
                pill.innerHTML = `<span>${formatLabel(type)}</span><button type="button" title="Supprimer" onclick="removeType('${type}')">×</button>`;
                list.appendChild(pill);

                const option = document.createElement('option');
                option.value = type;
                option.textContent = formatLabel(type);
                typeSelect.appendChild(option);
            });

            selectedTypesForAnnouncement = selectedTypesForAnnouncement.filter((type) => types.includes(type));
            renderSelectedAnnouncementTypes();

            if (typeCount) {
                typeCount.textContent = `${types.length} type${types.length > 1 ? 's' : ''}`;
            }
        }

        function renderSelectedAnnouncementTypes() {
            const container = document.getElementById('selected-types');
            if (!container) return;
            container.innerHTML = '';

            selectedTypesForAnnouncement.forEach((type) => {
                const pill = document.createElement('div');
                pill.className = 'type-pill';
                pill.innerHTML = `<span>${formatLabel(type)}</span><button type="button" title="Retirer" onclick="removeTypeFromAnnouncement('${type}')">×</button>`;
                container.appendChild(pill);
            });
        }

        function addTypeToAnnouncement() {
            const typeSelect = document.getElementById('annonce-type');
            const value = typeSelect ? typeSelect.value : '';
            if (!value) {
                showToast('Choisissez un type à ajouter.');
                return;
            }
            if (selectedTypesForAnnouncement.includes(value)) {
                showToast('Cette étiquette est déjà ajoutée.');
                return;
            }
            selectedTypesForAnnouncement.push(value);
            renderSelectedAnnouncementTypes();
        }

        function removeTypeFromAnnouncement(type) {
            selectedTypesForAnnouncement = selectedTypesForAnnouncement.filter((entry) => entry !== type);
            renderSelectedAnnouncementTypes();
        }

        function renderScopeSelect() {
            const select = document.getElementById('annonce-scope');
            select.innerHTML = '';
            ALLOWED_SCOPES.forEach((scope) => {
                const option = document.createElement('option');
                option.value = scope;
                option.textContent = formatLabel(scope);
                select.appendChild(option);
            });
        }

        function renderAnnouncementsList() {
            const list = document.getElementById('annonce-list');
            const items = loadAnnouncements().sort((a, b) => b.createdAt - a.createdAt);

            list.innerHTML = '';
            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = 'Aucune annonce publiée pour le moment.';
                list.appendChild(empty);
                return;
            }

            items.forEach((item) => {
                const itemTypes = normalizeAnnouncementTypes(item);
                const typeBadges = itemTypes
                    .map((type) => `<span class="sk-badge is-grade">${formatLabel(type)}</span>`)
                    .join('');
                const node = document.createElement('article');
                node.className = 'item';
                node.innerHTML = `
                    <div>
                        <div class="meta">
                            <span class="sk-badge is-staff">${formatLabel(item.scope || item.menu || 'synkrone')}</span>
                            ${typeBadges}
                            <span class="muted">${item.dateLabel}</span>
                        </div>
                        <h4 class="item-title">${escapeHtml(item.title)}</h4>
                        <p class="muted">${escapeHtml(item.summary)}</p>
                        <p class="muted">${item.published === false ? 'Brouillon' : 'Publiée'}</p>
                    </div>
                    <div class="btn-row">
                        <button class="sk-btn" type="button" onclick="editAnnouncement(${item.id})">Modifier</button>
                        <button class="sk-btn danger" type="button" onclick="deleteAnnouncement(${item.id})">Supprimer</button>
                    </div>
                `;
                list.appendChild(node);
            });
        }

        function addType() {
            const input = document.getElementById('new-type');
            const value = normalizeType(input.value || '');
            if (!value) {
                showToast('Type invalide.');
                return;
            }
            const types = loadTypes();
            if (types.includes(value)) {
                showToast('Ce type existe déjà.');
                return;
            }
            types.push(value);
            saveTypes(types).then(() => {
                input.value = '';
                renderTypeList();
                showToast('Type ajouté.');
            });
        }

        function removeType(type) {
            const types = loadTypes().filter((entry) => entry !== type);
            if (!types.length) {
                showToast('Il faut conserver au moins un type.');
                return;
            }
            saveTypes(types).then(() => {
                renderTypeList();
                showToast('Type supprimé.');
            });
        }

        function editAnnouncement(id) {
            const item = itemCache.find((entry) => Number(entry.id) === Number(id));
            if (!item) return;
            editingId = item.id;
            document.getElementById('annonce-title').value = item.title || '';
            document.getElementById('annonce-scope').value = item.scope || 'synkrone';
            document.getElementById('annonce-summary').value = item.summary || '';
            document.getElementById('annonce-content').value = item.content || '';
            document.getElementById('annonce-published').checked = item.published !== false;
            selectedTypesForAnnouncement = Array.isArray(item.types) ? [...item.types] : [item.type].filter(Boolean);
            renderSelectedAnnouncementTypes();
            showToast('Annonce chargée pour modification.');
        }

        async function createAnnouncement() {
            const title = (document.getElementById('annonce-title').value || '').trim();
            const scope = document.getElementById('annonce-scope').value;
            const fallbackType = document.getElementById('annonce-type').value;
            const summary = (document.getElementById('annonce-summary').value || '').trim();
            const content = (document.getElementById('annonce-content').value || '').trim();
            const published = document.getElementById('annonce-published').checked;
            const types = [...selectedTypesForAnnouncement];
            if (!types.length && fallbackType) types.push(fallbackType);
            if (!title || !summary || !content || !types.length) {
                showToast('Complétez le titre, les étiquettes, le résumé et le contenu.');
                return;
            }
            const item = { scope, types, title, summary, content, published };
            const res = editingId
                ? await fetch(`/api/announcements/${editingId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                })
                : await fetch('/api/announcements', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                });
            if (!res.ok) {
                showToast('Enregistrement impossible.');
                return;
            }
            editingId = null;
            await refreshAnnouncements();
            document.getElementById('annonce-title').value = '';
            document.getElementById('annonce-summary').value = '';
            document.getElementById('annonce-content').value = '';
            document.getElementById('annonce-published').checked = true;
            selectedTypesForAnnouncement = [];
            renderSelectedAnnouncementTypes();
            renderAnnouncementsList();
            showToast('Annonce enregistrée.');
        }

        async function refreshAvis() {
            const list = document.getElementById('avis-list');
            if (!list) return;
            const res = await fetch('/api/temoignages?admin=1');
            const data = await res.json().catch(() => ({ items: [] }));
            const items = Array.isArray(data.items) ? data.items : [];
            if (!items.length) {
                list.innerHTML = '<div class="empty">Aucun avis en attente.</div>';
                return;
            }
            list.innerHTML = items.map((item) => `
                <article class="item">
                    <div>
                        <h4 class="item-title">${escapeHtml(item.displayName)}</h4>
                        <p class="muted">${escapeHtml(item.quote)}</p>
                        <p class="muted">${item.published ? 'Publié' : 'En attente'}</p>
                    </div>
                    <div class="btn-row">
                        <button class="sk-btn" type="button" onclick="toggleAvis(${item.id}, ${item.published ? 'false' : 'true'})">${item.published ? 'Retirer' : 'Publier'}</button>
                    </div>
                </article>`).join('');
        }

        async function toggleAvis(id, published) {
            await fetch(`/api/temoignages/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ published })
            });
            await refreshAvis();
        }

        function openTypesModal() {
            const modal = document.getElementById('types-modal');
            if (!modal) return;
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function closeTypesModal() {
            const modal = document.getElementById('types-modal');
            if (!modal) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
        }

        function closeTypesModalOnOverlay(event) {
            if (event.target.id === 'types-modal') closeTypesModal();
        }

        async function deleteAnnouncement(id) {
            await fetch(`/api/announcements/${id}`, { method: 'DELETE' });
            await refreshAnnouncements();
            renderAnnouncementsList();
            showToast('Annonce supprimée.');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await refreshAnnouncements();
            renderScopeSelect();
            renderTypeList();
            renderAnnouncementsList();
            await refreshAvis();
            const typesModal = document.getElementById('types-modal');
            if (typesModal) typesModal.addEventListener('click', closeTypesModalOnOverlay);
        });
    </script>
</body>
</html>
