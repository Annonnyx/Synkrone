<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Équipe - Annonces</title>
    <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpg">
    <style>
        :root {
            --bg-main: #181a1b;
            --bg-panel: rgba(34, 37, 39, 0.88);
            --bg-panel-strong: rgba(28, 31, 33, 0.95);
            --text-main: #d1cdc7;
            --text-muted: #8b8f92;
            --accent: #d32f2f;
            --border: #383c3f;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: none;
        }

        *::-webkit-scrollbar { display: none; }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family);
        }

        body {
            padding: 12px;
        }

        .page {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .title {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 8px;
        }

        .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
        }

        input, select, textarea {
            border: 1px solid var(--border);
            background: var(--bg-panel-strong);
            color: var(--text-main);
            border-radius: 6px;
            padding: 8px 9px;
            font-size: 13px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            border-color: var(--accent);
            background: rgba(211, 47, 47, 0.15);
            color: #fff;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
        }

        .type-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .type-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .type-picker select {
            min-width: 180px;
        }

        .type-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-panel-strong);
            border: 1px solid rgba(211, 47, 47, 0.35);
            color: #ffe0e0;
            border-radius: 999px;
            font-size: 11px;
            padding: 4px 8px;
        }

        .type-pill button {
            border: none;
            background: transparent;
            color: #ff9f9f;
            font-size: 12px;
            cursor: pointer;
        }

        .config-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .list {
            display: grid;
            gap: 8px;
        }

        .item {
            background: var(--bg-panel-strong);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: start;
        }

        .item-title {
            font-size: 14px;
            color: #fff;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }

        .badge {
            font-size: 10px;
            text-transform: uppercase;
            border: 1px solid rgba(211, 47, 47, 0.35);
            background: rgba(120, 20, 20, 0.55);
            color: #fff5f5;
            border-radius: 999px;
            padding: 3px 7px;
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        .muted {
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .empty {
            border: 1px dashed var(--border);
            border-radius: 6px;
            padding: 14px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .toast {
            position: fixed;
            right: 12px;
            bottom: 12px;
            background: rgba(24, 26, 27, 0.96);
            border: 1px solid rgba(211, 47, 47, 0.4);
            border-radius: 6px;
            color: #fff;
            padding: 9px 12px;
            font-size: 12px;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
            z-index: 20;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            width: min(560px, 100%);
            background: var(--bg-panel-strong);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: grid;
            gap: 10px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }

        @media (max-width: 980px) {
            .page {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="/design/synkrone.css">
</head>
<body>
    <div class="page">
        <section class="panel">
            <div class="section-header">
                <h1 class="title" style="margin-bottom:0;">Créer une annonce</h1>
                <div class="btn-row" style="margin-top:0;">
                    <button class="btn btn-secondary" onclick="openTypesModal()">Gérer les types</button>
                    <span id="type-count" class="config-count">0 type</span>
                </div>
            </div>
            <p class="subtitle">Les annonces publiées ici alimentent directement l'accueil.</p>

            <div class="field">
                <label class="label" for="annonce-title">Titre</label>
                <input id="annonce-title" type="text" maxlength="100" placeholder="Titre de l'annonce">
            </div>

            <div class="field">
                <label class="label" for="annonce-scope">Univers</label>
                <select id="annonce-scope"></select>
            </div>

            <div class="field">
                <label class="label" for="annonce-type">Types (étiquettes)</label>
                <div class="type-picker">
                    <select id="annonce-type"></select>
                    <button class="btn" type="button" onclick="addTypeToAnnouncement()">Ajouter l'étiquette</button>
                </div>
                <div id="selected-types" class="type-list"></div>
            </div>

            <div class="field">
                <label class="label" for="annonce-summary">Résumé</label>
                <textarea id="annonce-summary" maxlength="240" placeholder="Résumé court pour la carte"></textarea>
            </div>

            <div class="field">
                <label class="label" for="annonce-content">Contenu détaillé</label>
                <textarea id="annonce-content" maxlength="2000" placeholder="Contenu complet affiché dans le modal"></textarea>
            </div>

            <div class="btn-row">
                <button class="btn" onclick="createAnnouncement()">Publier l'annonce</button>
            </div>

            <h3 class="title" style="margin-top:14px;">Annonces publiées</h3>
            <div id="annonce-list" class="list"></div>
        </section>
    </div>

    <div id="toast" class="toast"></div>

    <div id="types-modal" class="modal" aria-hidden="true">
        <article class="modal-content">
            <div class="modal-top">
                <h2 class="modal-title">Gérer les types d'annonce</h2>
                <button class="btn" onclick="closeTypesModal()">Fermer</button>
            </div>

            <div class="field">
                <label class="label" for="new-type">Nouveau type</label>
                <input id="new-type" type="text" placeholder="ex: maintenance">
            </div>
            <div class="btn-row">
                <button class="btn" onclick="addType()">Ajouter le type</button>
            </div>
            <div id="type-list" class="type-list"></div>
        </article>
    </div>

    <script>
        const STORAGE_TYPES = 'synkroneAnnouncementTypes';
        const STORAGE_ITEMS = 'synkroneAnnouncements';
        const ALLOWED_SCOPES = ['synkrone', 'bots', 'bump', 'me', 'dashbot', 'serveur', 'modpack'];
        const DEFAULT_TYPES = ['maj', 'nerf', 'event', 'boutique'];

        let toastTimer;
        let selectedTypesForAnnouncement = [];

        function normalizeType(value) {
            return value
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9-]/g, '');
        }

        function loadTypes() {
            try {
                const raw = localStorage.getItem(STORAGE_TYPES);
                const parsed = raw ? JSON.parse(raw) : DEFAULT_TYPES;
                return Array.isArray(parsed) && parsed.length ? parsed : [...DEFAULT_TYPES];
            } catch {
                return [...DEFAULT_TYPES];
            }
        }

        function saveTypes(types) {
            localStorage.setItem(STORAGE_TYPES, JSON.stringify(types));
        }

        function loadAnnouncements() {
            try {
                const raw = localStorage.getItem(STORAGE_ITEMS);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function saveAnnouncements(items) {
            localStorage.setItem(STORAGE_ITEMS, JSON.stringify(items));
        }

        function formatLabel(value) {
            if (!value) return '';
            const normalized = String(value).replaceAll('-', ' ');
            return normalized.charAt(0).toUpperCase() + normalized.slice(1);
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 2600);
        }

        function normalizeAnnouncementTypes(item) {
            const rawTypes = Array.isArray(item.types) && item.types.length
                ? item.types
                : [item.type].filter(Boolean);
            const cleaned = rawTypes
                .map((entry) => normalizeType(String(entry || '')))
                .filter(Boolean);
            return [...new Set(cleaned)];
        }

        function renderTypeList() {
            const list = document.getElementById('type-list');
            const typeSelect = document.getElementById('annonce-type');
            const typeCount = document.getElementById('type-count');
            const types = loadTypes();

            list.innerHTML = '';
            typeSelect.innerHTML = '';

            types.forEach((type) => {
                const pill = document.createElement('div');
                pill.className = 'type-pill';
                pill.innerHTML = `<span>${formatLabel(type)}</span><button title="Supprimer" onclick="removeType('${type}')">x</button>`;
                list.appendChild(pill);

                const option = document.createElement('option');
                option.value = type;
                option.textContent = formatLabel(type);
                typeSelect.appendChild(option);
            });

            selectedTypesForAnnouncement = selectedTypesForAnnouncement.filter((type) => types.includes(type));
            renderSelectedAnnouncementTypes();

            if (typeCount) {
                typeCount.textContent = `${types.length} type${types.length > 1 ? 's' : ''}`;
            }
        }

        function renderSelectedAnnouncementTypes() {
            const container = document.getElementById('selected-types');
            if (!container) return;
            container.innerHTML = '';

            selectedTypesForAnnouncement.forEach((type) => {
                const pill = document.createElement('div');
                pill.className = 'type-pill';
                pill.innerHTML = `<span>${formatLabel(type)}</span><button title="Retirer" onclick="removeTypeFromAnnouncement('${type}')">x</button>`;
                container.appendChild(pill);
            });
        }

        function addTypeToAnnouncement() {
            const typeSelect = document.getElementById('annonce-type');
            const value = typeSelect ? typeSelect.value : '';
            if (!value) {
                showToast('Choisis un type à ajouter.');
                return;
            }

            if (selectedTypesForAnnouncement.includes(value)) {
                showToast('Cette étiquette est déjà ajoutée.');
                return;
            }

            selectedTypesForAnnouncement.push(value);
            renderSelectedAnnouncementTypes();
        }

        function removeTypeFromAnnouncement(type) {
            selectedTypesForAnnouncement = selectedTypesForAnnouncement.filter((entry) => entry !== type);
            renderSelectedAnnouncementTypes();
        }

        function renderScopeSelect() {
            const select = document.getElementById('annonce-scope');
            select.innerHTML = '';
            ALLOWED_SCOPES.forEach((scope) => {
                const option = document.createElement('option');
                option.value = scope;
                option.textContent = formatLabel(scope);
                select.appendChild(option);
            });
        }

        function renderAnnouncementsList() {
            const list = document.getElementById('annonce-list');
            const items = loadAnnouncements().sort((a, b) => b.createdAt - a.createdAt);

            list.innerHTML = '';
            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = 'Aucune annonce publiée pour le moment.';
                list.appendChild(empty);
                return;
            }

            items.forEach((item) => {
                const itemTypes = normalizeAnnouncementTypes(item);
                const typeBadges = itemTypes
                    .map((type) => `<span class="badge">${formatLabel(type)}</span>`)
                    .join('');
                const node = document.createElement('article');
                node.className = 'item';
                node.innerHTML = `
                    <div>
                        <div class="meta">
                            <span class="badge">${formatLabel(item.scope || item.menu || 'synkrone')}</span>
                            ${typeBadges}
                            <span class="muted">${item.dateLabel}</span>
                        </div>
                        <h4 class="item-title">${item.title}</h4>
                        <p class="muted">${item.summary}</p>
                    </div>
                    <div>
                        <button class="btn" onclick="deleteAnnouncement(${item.id})">Supprimer</button>
                    </div>
                `;
                list.appendChild(node);
            });
        }

        function addType() {
            const input = document.getElementById('new-type');
            const value = normalizeType(input.value || '');
            if (!value) {
                showToast('Type invalide.');
                return;
            }

            const types = loadTypes();
            if (types.includes(value)) {
                showToast('Ce type existe déjà.');
                return;
            }

            types.push(value);
            saveTypes(types);
            input.value = '';
            renderTypeList();
            showToast('Type ajouté.');
        }

        function removeType(type) {
            const types = loadTypes().filter((entry) => entry !== type);
            if (!types.length) {
                showToast('Il faut conserver au moins un type.');
                return;
            }

            saveTypes(types);
            renderTypeList();
            showToast('Type supprimé.');
        }

        function createAnnouncement() {
            const title = (document.getElementById('annonce-title').value || '').trim();
            const scope = document.getElementById('annonce-scope').value;
            const fallbackType = document.getElementById('annonce-type').value;
            const summary = (document.getElementById('annonce-summary').value || '').trim();
            const content = (document.getElementById('annonce-content').value || '').trim();
            const types = [...selectedTypesForAnnouncement];
            if (!types.length && fallbackType) {
                types.push(fallbackType);
            }

            if (!title || !summary || !content || !types.length) {
                showToast('Complète le titre, les étiquettes, le résumé et le contenu.');
                return;
            }

            const now = new Date();
            const item = {
                id: Date.now(),
                scope,
                menu: scope,
                types,
                type: types[0],
                category: types[0],
                categoryLabel: types[0],
                date: now.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }),
                dateLabel: now.toLocaleString('fr-FR'),
                title,
                summary,
                content,
                createdAt: now.getTime()
            };

            const items = loadAnnouncements();
            items.push(item);
            saveAnnouncements(items);

            document.getElementById('annonce-title').value = '';
            document.getElementById('annonce-summary').value = '';
            document.getElementById('annonce-content').value = '';
            selectedTypesForAnnouncement = [];
            renderSelectedAnnouncementTypes();

            renderAnnouncementsList();
            showToast('Annonce publiée.');
        }

        function openTypesModal() {
            const modal = document.getElementById('types-modal');
            if (!modal) return;
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
        }

        function closeTypesModal() {
            const modal = document.getElementById('types-modal');
            if (!modal) return;
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
        }

        function closeTypesModalOnOverlay(event) {
            if (event.target.id === 'types-modal') {
                closeTypesModal();
            }
        }

        function deleteAnnouncement(id) {
            const items = loadAnnouncements().filter((item) => item.id !== id);
            saveAnnouncements(items);
            renderAnnouncementsList();
            showToast('Annonce supprimée.');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderScopeSelect();
            renderTypeList();
            renderAnnouncementsList();

            const typesModal = document.getElementById('types-modal');
            if (typesModal) {
                typesModal.addEventListener('click', closeTypesModalOnOverlay);
            }
        });
    </script>
</body>
</html>
