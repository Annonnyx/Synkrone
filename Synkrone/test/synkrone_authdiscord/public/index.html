        // --- ETAT SESSION FRONTEND ---
        const store = {
            user: null,
            oauth: { discord: false, github: false, google: false },
            panelOrigin: '/hebergement',
            internal: false,
            hub: false,
            supportInvite: 'https://discord.gg/p768u2Pgp3',
            krones: null
        };
        const SUPPORT_GRADE_ORDER = {
            Aucun: 0,
            Kronium: 1,
            Synkral: 2,
            Kronalloy: 3,
            Synkronite: 4,
            Kronix: 5
        };
        function isManualStaffRole(roleValue) {
            const normalized = String(roleValue || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            return ['staff', 'equipe', 'equipes', 'dev'].includes(normalized);
        }
        function resolveSupportGradeLabel(user) {
            const gradeFromProfile = String(user?.grade || 'Aucun');
            const roleFromProfile = String(user?.role || 'Krobi');
            const gradeRank = SUPPORT_GRADE_ORDER[gradeFromProfile] || 0;
            const roleRank = SUPPORT_GRADE_ORDER[roleFromProfile] || 0;
            const topRank = Math.max(gradeRank, roleRank);
            if (topRank <= 0) return 'Krobi';
            return Object.keys(SUPPORT_GRADE_ORDER).find((name) => SUPPORT_GRADE_ORDER[name] === topRank) || 'Krobi';
        }
        function resolveHeaderRoleBadge(user) {
            if (!user) return 'Krobi';
            const rawRole = String(user.role || 'Krobi').trim() || 'Krobi';
            const isAdminProfile = Boolean(user.isTeamOwner);
            const isStaffProfile = !isAdminProfile && isManualStaffRole(rawRole);
            if (isAdminProfile) {
                return 'Admin';
            }
            if (String(rawRole).toLowerCase() === 'dev') {
                return 'Dev';
            }
            if (isStaffProfile) {
                return 'Équipe';
            }
            return resolveSupportGradeLabel(user);
        }
        
        function formatKrones(value) {
            if (value >= 1e9) return (value / 1e9).toFixed(1).replace(/\.0$/, '') + ' MM';
            if (value >= 1e6) return (value / 1e6).toFixed(1).replace(/\.0$/, '') + ' M';
            if (value >= 1e3) return (value / 1e3).toFixed(1).replace(/\.0$/, '') + ' K';
            return value.toString();
        }
        function siteLoginUrl(returnTo) {
            const fallback = `${window.location.pathname || '/'}${window.location.search || ''}`;
            const dest = encodeURIComponent(returnTo || fallback);
            return `/login?returnTo=${dest}`;
        }
        function kronesBadgeHtml() {
            if (!store.user) {
                return `<a class="btn-krones" href="${siteLoginUrl('/krones')}" title="Portefeuille Krônes">
                    <span class="btn-krones-label">Krônes</span>
                    <span class="btn-krones-value">
                        <span class="btn-krones-amount">—</span>
                        <span class="btn-krones-unit">₭</span>
                    </span>
                </a>`;
            }
            const fromUser = typeof store.user?.krone === 'number' ? store.user.krone : null;
            const fromWallet = typeof store.krones?.balance === 'number' ? store.krones.balance : null;
            const safeKrone = fromUser !== null ? fromUser : fromWallet;
            const unlimited = Boolean(store.krones?.unlimited);
            const hasAmount = typeof safeKrone === 'number';
            const kroneLabel = hasAmount && safeKrone <= 1 ? 'Krône' : 'Krônes';
            const formatted = unlimited ? '∞' : (hasAmount ? formatKrones(safeKrone) : '—');
            const title = unlimited
                ? 'Krônes illimités'
                : (hasAmount ? `${Number(safeKrone).toLocaleString('fr-FR')} ${kroneLabel}` : 'Portefeuille Krônes');
            return `<button type="button" class="btn-krones" title="${title}" onclick="navigateToMainSection('krones', { updateUrl: true })">
                <span class="btn-krones-label">${kroneLabel}</span>
                <span class="btn-krones-value">
                    <span class="btn-krones-amount">${formatted}</span>
                    <span class="btn-krones-unit">₭</span>
                </span>
            </button>`;
        }
        function fetchJson(url, ms = 4000) {
            const ctrl = new AbortController();
            const timer = window.setTimeout(() => ctrl.abort(), ms);
            return fetch(url, { signal: ctrl.signal }).finally(() => window.clearTimeout(timer));
        }
        async function loadKronesWallet() {
            try {
                const res = await fetchJson('/api/krones');
                if (!res.ok) return;
                store.krones = await res.json();
                if (store.user && typeof store.krones?.balance === 'number') {
                    store.user.krone = store.krones.balance;
                    if (store.krones.plan) store.user.grade = store.krones.plan;
                }
            } catch {
                // no-op
            }
        }
        function loginButtonsHtml() {
            return `<a class="btn-login" href="${siteLoginUrl()}" target="_top">Se connecter</a>`;
        }
        function themeToggleHtml() {
            const theme = window.synkroneTheme ? synkroneTheme.read() : 'light';
            const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v1.5M12 19.5V21M4.5 12H3M21 12h-1.5M6.2 6.2l1.1 1.1M16.7 16.7l1.1 1.1M6.2 17.8l1.1-1.1M16.7 7.3l1.1-1.1"></path></svg>';
            const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5A8.5 8.5 0 1 1 8.5 4 7 7 0 0 0 20 15.5z"></path></svg>';
            return `<div class="theme-toggle" role="group" aria-label="Thème">
                <button type="button" class="theme-opt" data-theme-set="light" title="Clair" aria-pressed="${theme === 'light'}" onclick="setSiteTheme('light')">${sun}<span>Clair</span></button>
                <button type="button" class="theme-opt" data-theme-set="dark" title="Sombre" aria-pressed="${theme === 'dark'}" onclick="setSiteTheme('dark')">${moon}<span>Sombre</span></button>
            </div>`;
        }
        function setSiteTheme(theme) {
            if (!window.synkroneTheme) return;
            synkroneTheme.set(theme);
            renderUI();
        }
        function bindFrameTheme() {}
        function publicToolsHtml() {
            if (!store.internal) return '';
            return `<nav class="sk-app-nav" aria-label="Hub">
                <a href="/hub">Hub</a>

        function internalNavHtml() {

            return `<nav class="sk-app-nav" aria-label="Outils internes">
                <a href="/ui/">ui</a>
                <a href="/sharing/">sharing</a>
            </nav>`;
        }
        async function loadMenu() {
            const menuContainer = document.getElementById('menu-container');
            if (!menuContainer) return;
            try {
                if (!menuContainer.querySelector('#app-nav')) {
                    const res = await fetchJson('/menu.html', 3000);
                    if (res.ok) menuContainer.innerHTML = await res.text();
                }
                bindNavToggle();
                try {
                    const cfg = await fetchJson('/api/config', 3000);
                    if (cfg.ok) {
                        const data = await cfg.json();
                        if (data.panelOrigin) store.panelOrigin = data.panelOrigin;
                        store.internal = Boolean(data.internal);
                        if (data.hub !== undefined) store.hub = Boolean(data.hub);
                        store.supportInvite = data.supportInvite || store.supportInvite;
                        const hosting = menuContainer.querySelector('#nav-hosting');
                        if (hosting && data.panelOrigin) hosting.setAttribute('href', data.panelOrigin);
                        const footerDiscord = document.getElementById('footer-discord');
                        if (footerDiscord && store.supportInvite) footerDiscord.setAttribute('href', store.supportInvite);
                        const legal = document.getElementById('footer-legal');
                        if (legal) {
                            if (data.sellerReady && data.seller) {
                                const bits = [data.seller.name, data.seller.address, data.seller.siret && `SIRET ${data.seller.siret}`].filter(Boolean);
                                legal.textContent = bits.join(' · ');
                            } else {
                                legal.textContent = 'Identité du vendeur affichée à la commande dès qu’elle est renseignée.';
                            }
                        }
                    }
                } catch { /* default localhost */ }
            } catch (e) {
                console.error("Erreur lors du chargement du menu", e);
            }
        }
        async function loadSessionUser() {
            try {
                const res = await fetchJson('/api/me');
                if (!res.ok) {
                    return;
                }
                const data = await res.json();
                store.user = data.authenticated ? data.user : null;
                store.oauth = data.providers || { discord: Boolean(data.oauthConfigured), github: false, google: false };
            } catch (e) {
                console.error("Erreur lors du chargement de la session", e);
            }
        }
        function mergeSessionUserUpdate(incomingUser) {
            if (!incomingUser || typeof incomingUser !== 'object') return;
            const currentId = String(store.user?.id || '').trim();
            const incomingId = String(incomingUser?.id || '').trim();
            if (currentId && incomingId && currentId !== incomingId) {
                return;
            }
            store.user = {
                ...(store.user || {}),
                ...incomingUser
            };
            renderUI();
        }
        async function refreshSessionUserSilently() {
            try {
                const res = await fetchJson('/api/me');
                if (!res.ok) return;
                const data = await res.json();
                if (!data?.authenticated || !data.user) return;
                mergeSessionUserUpdate(data.user);
            } catch {
                // no-op
            }
        }
        function canAccessAdmin() {
            return Boolean(store.user && store.user.isTeamOwner);
        }
        function canAccessEquipe() {
            if (!store.user) return false;
            if (store.user.isTeamOwner) return true;
            return isManualStaffRole(store.user.role) || store.user.role === 'Admin';
        }
        function applyMenuVisibility() {

            if (equipeTab) equipeTab.classList.toggle('hidden', !canAccessEquipe());

        function applyPageSeo(mainSection, options = {}) {
            let title = PAGE_TITLES[mainSection] || 'Synkrone.app';
            if (mainSection === 'discord' && options.botsTab && BOT_TITLES[options.botsTab]) {
                title = BOT_TITLES[options.botsTab];
            } else if (mainSection === 'minecraft' && options.subTab === 'modpack') {
                title = 'Synkrone — Modpacks';
            }
            document.title = title;
            let description = PAGE_DESCRIPTIONS[mainSection] || PAGE_DESCRIPTIONS.accueil;
            if (mainSection === 'discord' && options.botsTab && BOT_DESCRIPTIONS[options.botsTab]) {
                description = BOT_DESCRIPTIONS[options.botsTab];
            }
            const path = normalizePath(window.location.pathname);
            const url = SITE_ORIGIN + (path === '/' ? '/' : path);
            const ogTitle = document.querySelector('meta[property="og:title"]');
            const twTitle = document.querySelector('meta[name="twitter:title"]');
            const ogUrl = document.querySelector('meta[property="og:url"]');
            const canonical = document.querySelector('link[rel="canonical"]');
            const desc = document.querySelector('meta[name="description"]');
            const ogDesc = document.querySelector('meta[property="og:description"]');
            const twDesc = document.querySelector('meta[name="twitter:description"]');
            if (ogTitle) ogTitle.setAttribute('content', title);
            if (twTitle) twTitle.setAttribute('content', title);
            if (ogUrl) ogUrl.setAttribute('content', url);
            if (canonical) canonical.setAttribute('href', url);
            if (desc) desc.setAttribute('content', description);
            if (ogDesc) ogDesc.setAttribute('content', description);
            if (twDesc) twDesc.setAttribute('content', description);
        }

        function normalizePath(pathname) {
            if (!pathname) return '/';
            if (pathname.length > 1 && pathname.endsWith('/')) {
                return pathname.slice(0, -1);
            }
            return pathname;
        }

        function parseRoute(pathname) {
            const currentPath = normalizePath(pathname || '/');
            
            if (currentPath === '/') {
                return { mainSection: 'accueil', subTab: null, canonical: '/accueil' };
            }
            if (currentPath === '/discord/bots') {
                return {
                    mainSection: 'discord',
                    subTab: 'bots',
                    canonical: '/discord/bots'
                };
            }
            if (currentPath === '/minecraft/modpack') {
                return {
                    mainSection: 'minecraft',
                    subTab: 'modpack',
                    modpackTab: 'accueil',
                    canonical: '/minecraft/modpack/accueil'
                };
            }
            
            const botsPrefix = '/discord/bots/';
            if (currentPath.startsWith(botsPrefix)) {
                const botsTab = currentPath.slice(botsPrefix.length);
                if (!DISCORD_BOT_PAGES.has(botsTab)) {
                    return { mainSection: 'discord', subTab: 'bots', canonical: '/discord/bots' };
                }
                return {
                    mainSection: 'discord',
                    subTab: 'bots',
                    botsTab,
                    canonical: currentPath
                };
            }
            
            const modpackPrefix = '/minecraft/modpack/';
            if (currentPath.startsWith(modpackPrefix)) {
                const modpackTab = currentPath.slice(modpackPrefix.length);
                return {
                    mainSection: 'minecraft',
                    subTab: 'modpack',
                    modpackTab,
                    canonical: currentPath
                };
            }
            
            const cloudPrefix = '/equipe/cloud/';
            if (currentPath.startsWith(cloudPrefix)) {
                const cloudPath = currentPath.slice(cloudPrefix.length);
                return {
                    mainSection: 'equipe',
                    subTab: 'cloud',
                    cloudPath,
                    canonical: currentPath
                };
            }
            
            for (const [mainSection, section] of Object.entries(APP_STRUCTURE)) {
                if (!section.pages) {
                    if (currentPath === section.route) {
                        return { mainSection, subTab: null, canonical: section.route };
                    }
                    continue;
                }
                if (currentPath === section.route) {
                    const defaultPath = section.routes ? section.routes[section.defaultSubTab] : section.route;
                    return { mainSection, subTab: section.defaultSubTab, canonical: defaultPath };
                }
                const sectionRoutes = section.routes || {};
                for (const [subTab, routePath] of Object.entries(sectionRoutes)) {
                    if (currentPath === routePath) {
                        return { mainSection, subTab, canonical: routePath };
                    }
                }
            }
            
            // Si la route n'a correspondu à rien d'autre, on part du principe que c'est un profil (ex: /vex)
            const cleanPath = currentPath.replace(/^\//, '');
            if (cleanPath && !cleanPath.includes('/')) {
                return { 
                    mainSection: 'me', 
                    subTab: null, 
                    profileTab: currentPath, 
                    canonical: currentPath
                };
            }

            return { mainSection: 'accueil', subTab: null, canonical: '/accueil' };
        }

        const QUERY_LEAF_SECTIONS = new Set(['login', 'serveur']);

        function leafSearch(mainSection, explicit) {
            if (!QUERY_LEAF_SECTIONS.has(mainSection)) return '';
            if (typeof explicit === 'string') return explicit;
            return window.location.search || '';
        }

        function withSearch(path, search) {
            if (!path) return path;
            if (!search) return path;
            return search.startsWith('?') ? `${path}${search}` : `${path}?${search}`;
        }

        function syncBrowserPath(nextPath, replaceHistory = false, search = '') {
            const targetPath = normalizePath(nextPath);
            const nextSearch = search || '';
            const currentPath = normalizePath(window.location.pathname);
            const currentSearch = window.location.search || '';
            if (targetPath === currentPath && nextSearch === currentSearch) return;
            const href = `${targetPath}${nextSearch}`;
            if (replaceHistory) {
                window.history.replaceState({}, '', href);
                return;
            }
            window.history.pushState({}, '', href);
        }

        function applyLeafHead(html) {
            document.querySelectorAll('[data-leaf-asset]').forEach((el) => el.remove());
            const wrap = document.createElement('div');
            wrap.innerHTML = html || '';
            [...wrap.querySelectorAll('link,style')].forEach((el) => {
                el.setAttribute('data-leaf-asset', '1');
                document.head.appendChild(el);
            });
        }

        function replayLeafScripts(root) {
            const scripts = [...root.querySelectorAll('script')];
            const pending = [];
            const orig = EventTarget.prototype.addEventListener;
            EventTarget.prototype.addEventListener = function (type, fn, opts) {
                if ((type === 'DOMContentLoaded' || type === 'load') && this === document) {
                    pending.push(fn);
                    return;
                }
                return orig.call(this, type, fn, opts);
            };
            for (const old of scripts) {
                const src = old.getAttribute('src') || '';
                if (src.includes('theme-boot.js')) {
                    old.remove();
                    continue;
                }
                const copy = document.createElement('script');
                for (const attr of old.attributes) copy.setAttribute(attr.name, attr.value);
                copy.textContent = old.textContent;
                old.replaceWith(copy);
            }
            EventTarget.prototype.addEventListener = orig;
            pending.forEach((fn) => {
                try { fn.call(document); } catch (err) { console.error(err); }
            });
        }

        async function loadLeaf(path) {
            const root = document.getElementById('content-root');
            if (!root || !path) return;
            if (root.dataset.leaf === path && root.childNodes.length) return;
            const res = await fetch(path, { credentials: 'same-origin', cache: 'no-store' });
            if (!res.ok) {
                root.innerHTML = '<p style="padding:24px">Page indisponible.</p>';
                root.dataset.leaf = '';
                return;
            }
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const links = [...doc.head.querySelectorAll('link[rel="stylesheet"]')]
                .filter((el) => !/fonts\.googleapis|fonts\.gstatic/.test(el.href || ''))
                .map((el) => el.outerHTML);
            const styles = [...doc.head.querySelectorAll('style')].map((el) => el.outerHTML);
            applyLeafHead(`${links.join('')}${styles.join('')}`);
            root.innerHTML = doc.body.innerHTML;
            root.dataset.leaf = path;
            replayLeafScripts(root);
        }

        function setActiveMainTab(mainSection) {
            const mainTabs = document.querySelectorAll('.nav-tab');
            mainTabs.forEach(tab => {
                const target = tab.getAttribute('data-target');
                tab.classList.toggle('active', target === mainSection);
            });
        }

        function setActiveSubTab(activeTabName) {
            const subTabs = document.querySelectorAll('#section-menu-container .sub-nav-tab');
            subTabs.forEach(tab => {
                const target = tab.getAttribute('data-target');
                tab.classList.toggle('active', target === activeTabName);
            });
        }

        async function loadSectionMenu(mainSection) {
            const sectionMenuContainer = document.getElementById('section-menu-container');
            const root = document.getElementById('content-root');
            const section = APP_STRUCTURE[mainSection];
            if (!sectionMenuContainer || !root || !section) return;
            if (!section.menu) {
                sectionMenuContainer.innerHTML = '';
                root.classList.remove('with-section-menu');
                return;
            }
            try {
                const res = await fetch(`${section.menu}?v=2`, { cache: 'no-store' });
                if (!res.ok) {
                    sectionMenuContainer.innerHTML = '';
                    root.classList.remove('with-section-menu');
                    return;
                }
                sectionMenuContainer.innerHTML = await res.text();
                root.classList.add('with-section-menu');
            } catch (e) {
                console.error("Erreur lors du chargement du menu de section", e);
                sectionMenuContainer.innerHTML = '';
                root.classList.remove('with-section-menu');
            }
        }

        function bindSectionMenuEvents(mainSection) {
            const section = APP_STRUCTURE[mainSection];
            if (!section || !section.pages) return;
            const subTabs = document.querySelectorAll('#section-menu-container .sub-nav-tab');
            subTabs.forEach(tab => {
                tab.onclick = (e) => {
                    const subTarget = e.currentTarget.getAttribute('data-target');
                    const pagePath = e.currentTarget.getAttribute('data-page') || section.pages[subTarget];
                    if (!pagePath) return;
                    e.preventDefault();
                    setActiveSubTab(subTarget);
                    loadLeaf(pagePath);
                    const targetRoute = section.routes?.[subTarget] || section.route;
                    syncBrowserPath(targetRoute);
                };
            });
        }

        async function navigateToMainSection(mainSection, options = {}) {
            const { subTab = null, updateUrl = true, replaceHistory = false, botsTab = null, modpackTab = null, cloudPath = null, profileTab = null, search = undefined } = options;
            const section = APP_STRUCTURE[mainSection];
            if (!section) return;
            if (mainSection === 'admin' && !canAccessAdmin()) {
                if (!store.user) {
                    window.location.replace(siteLoginUrl(window.location.pathname));
                    return;
                }
                await navigateToMainSection('accueil', { updateUrl: true, replaceHistory: true });
                return;
            }
            if (mainSection === 'equipe' && !canAccessEquipe()) {
                await navigateToMainSection('accueil', { updateUrl: true, replaceHistory: true });
                return;
            }
            setActiveMainTab(mainSection);
            document.body.classList.toggle('is-home', mainSection === 'accueil');
            await loadSectionMenu(mainSection);
            if (!section.pages) {
                let leafPath = section.page;
                if (mainSection === 'me' && profileTab) {
                    leafPath = `${section.page}?profile=${encodeURIComponent(profileTab.replace(/^\//, ''))}`;
                }
                const query = leafSearch(mainSection, search);
                await loadLeaf(withSearch(leafPath, query));
                if (updateUrl) {
                    const leafRoute = (mainSection === 'me' && profileTab)
                        ? profileTab
                        : (section.route || section.page);
                    syncBrowserPath(leafRoute, replaceHistory, QUERY_LEAF_SECTIONS.has(mainSection) ? query : '');
                }
                applyPageSeo(mainSection, { botsTab, subTab, modpackTab });
                return;
            }
            bindSectionMenuEvents(mainSection);
            const resolvedSubTab = subTab && section.pages[subTab] ? subTab : section.defaultSubTab;
            setActiveSubTab(resolvedSubTab);
            let framePath = section.pages[resolvedSubTab];
            
            if (mainSection === 'discord' && resolvedSubTab === 'bots' && DISCORD_BOT_PAGES.has(botsTab)) {
                framePath = `/discord/bots/${botsTab}.html`;
            }
            if (mainSection === 'minecraft' && resolvedSubTab === 'modpack' && modpackTab) {
                framePath = `${framePath}?tab=${encodeURIComponent(modpackTab)}`;
            }
            if (mainSection === 'equipe' && resolvedSubTab === 'cloud' && cloudPath) {
                framePath = `${framePath}?cloudPath=${encodeURIComponent(cloudPath)}`;
            }

            await loadLeaf(framePath);
            
            if (updateUrl) {
                const sectionRoutes = section.routes || {};
                let targetRoute = sectionRoutes[resolvedSubTab] || section.route;
                if (mainSection === 'discord' && resolvedSubTab === 'bots') {
                    targetRoute = DISCORD_BOT_PAGES.has(botsTab) ? `/discord/bots/${botsTab}` : '/discord/bots';
                }
                if (mainSection === 'minecraft' && resolvedSubTab === 'modpack') {
                    targetRoute = `/minecraft/modpack/${modpackTab || 'accueil'}`;
                }
                if (mainSection === 'equipe' && resolvedSubTab === 'cloud' && cloudPath) {
                    targetRoute = `/equipe/cloud/${cloudPath}`;
                }
                syncBrowserPath(targetRoute, replaceHistory);
            }
            applyPageSeo(mainSection, { botsTab, subTab: resolvedSubTab, modpackTab });
        }

        function bindNavToggle() {
            const toggle = document.getElementById('nav-toggle');
            const container = document.getElementById('menu-container');
            if (!toggle || !container) return;
            toggle.onclick = () => {
                const open = container.classList.toggle('nav-open');
                toggle.setAttribute('aria-expanded', String(open));
            };
        }
        function closeMobileNav() {
            const container = document.getElementById('menu-container');
            const toggle = document.getElementById('nav-toggle');
            if (container) container.classList.remove('nav-open');
            if (toggle) toggle.setAttribute('aria-expanded', 'false');
        }
        function initMainNavigation() {
            const mainTabs = document.querySelectorAll('.nav-tab');
            mainTabs.forEach(tab => {
                tab.addEventListener('click', async (e) => {
                    if (tab.classList.contains('nav-tab-external') || tab.id === 'nav-hosting') {
                        closeMobileNav();
                        return;
                    }
                    const mainSection = e.currentTarget.getAttribute('data-target');
                    if (!mainSection) return;
                    e.preventDefault();
                    closeMobileNav();
                    await navigateToMainSection(mainSection, { updateUrl: true });
                });
            });
        }

        function applyMobileHeaderBrandVisibility() {
            document.body.classList.remove('hide-brand-mobile');
        }
        
        // --- RENDU DYNAMIQUE DE L'INTERFACE ---
        function renderUI() {
            const header = document.getElementById('app-header');
            const user = store.user;
            if (!user) {
                header.innerHTML = `
                    <div class="header-top">
                        <button type="button" class="header-brand" onclick="navigateToMainSection('accueil', { updateUrl: true })" aria-label="Synkrone accueil">
                            <img src="/assets/images/logo.jpg" alt="">
                            <span class="brand-title">Synkrone</span><span class="brand-tld">.app</span>
                        </button>
                        ${publicToolsHtml()}
                        ${internalNavHtml()}
                    </div>
                    <div class="header-bottom">
                        <div class="header-user">
                            <div class="krones-center-section">${kronesBadgeHtml()}</div>
                            ${themeToggleHtml()}
                            ${loginButtonsHtml()}
                        </div>
                    </div>
                `;
            } else {
                const safeRole = resolveHeaderRoleBadge(user);
                const safeAvatar = user.avatar || '/assets/images/logo.jpg';
                const badgeClass = safeRole === 'Admin' ? 'badge badge-admin' : 'badge badge-role';
                
                header.innerHTML = `
                    <div class="header-top">
                        <button type="button" class="header-brand" onclick="navigateToMainSection('accueil', { updateUrl: true })" aria-label="Synkrone accueil">
                            <img src="/assets/images/logo.jpg" alt="">
                            <span class="brand-title">Synkrone</span><span class="brand-tld">.app</span>
                        </button>
                        ${publicToolsHtml()}
                        ${internalNavHtml()}
                    </div>
                    <div class="header-bottom">
                        <div class="header-user">
                            
                            <button class="btn-roulette" onclick="openRouletteModal()" title="Roulette">
                                Roulette
                            </button>
                            
                            <button type="button" class="user-account-link" onclick="navigateToMainSection('compte', { updateUrl: true })" title="Compte">
                                <div class="user-left-section">
                                    <div class="avatar-wrapper">
                                        <img class="user-avatar" src="${safeAvatar}" alt="" onerror="this.src='/assets/images/logo.jpg';">
                                        <div class="${badgeClass}"><span>${safeRole}</span></div>
                                    </div>
                                    <span class="user-name">${user.username}</span>
                                </div>
                            </button>
                            
                            <div class="krones-center-section">${kronesBadgeHtml()}</div>
                            
                            <div class="header-actions">
                                ${themeToggleHtml()}
                                <button class="btn-symbol logout" title="Déconnexion" onclick="logout()">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                        <polyline points="16 17 21 12 16 7"></polyline>
                                        <line x1="21" y1="12" x2="9" y2="12"></line>
                                    </svg>
                                </button>
                            </div>
                            
                        </div>
                    </div>
                `;
            }
            applyMenuVisibility();
            applyMobileHeaderBrandVisibility();
        }
        
        function openRouletteModal() {
            const modal = document.getElementById('roulette-modal');
            if (!modal) return;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeRouletteModal() {
            const modal = document.getElementById('roulette-modal');
            if (!modal) return;
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }
        
        // --- DÉMARRAGE ---
        (async function init() {
            bindNavToggle();
            bindFrameTheme();
            renderUI();
            initMainNavigation();

            const rouletteModal = document.getElementById('roulette-modal');
            if (rouletteModal) {
                rouletteModal.addEventListener('click', (event) => {
                    if (event.target === rouletteModal) closeRouletteModal();
                });
            }
            const pathNow = normalizePath(window.location.pathname);
            if (pathNow === '/hebergement' || pathNow.startsWith('/hebergement/')) {
                return;
            }
            if (pathNow === '/dashboard' || pathNow.startsWith('/dashboard/')) {
                window.location.replace(`/hebergement${pathNow}${window.location.search}${window.location.hash}`);
                return;
            }
            const route = parseRoute(window.location.pathname);
            const needsGate = route.mainSection === 'admin' || route.mainSection === 'equipe';
            const menuP = loadMenu();
            const sessionP = loadSessionUser();
            const kronesP = loadKronesWallet();
            if (!needsGate) {
                void navigateToMainSection(route.mainSection, {
                    subTab: route.subTab,
                    botsTab: route.botsTab || null,
                    modpackTab: route.modpackTab || null,
                    cloudPath: route.cloudPath || null,
                    profileTab: route.profileTab || null,
                    search: window.location.search || '',
                    updateUrl: true,
                    replaceHistory: normalizePath(window.location.pathname) !== normalizePath(route.canonical)
                });
            }
            await Promise.all([menuP, sessionP]);
            renderUI();
            if (needsGate) {
                await navigateToMainSection(route.mainSection, {
                    subTab: route.subTab,
                    botsTab: route.botsTab || null,
                    modpackTab: route.modpackTab || null,
                    cloudPath: route.cloudPath || null,
                    profileTab: route.profileTab || null,
                    search: window.location.search || '',
                    updateUrl: true,
                    replaceHistory: normalizePath(window.location.pathname) !== normalizePath(route.canonical)
                });
            }
            void kronesP.then(() => renderUI());
            window.addEventListener('popstate', async () => {
                const popRoute = parseRoute(window.location.pathname);
                await navigateToMainSection(popRoute.mainSection, {
                    subTab: popRoute.subTab,
                    botsTab: popRoute.botsTab || null,
                    modpackTab: popRoute.modpackTab || null,
                    cloudPath: popRoute.cloudPath || null,
                    profileTab: popRoute.profileTab || null,
                    search: window.location.search || '',
                    updateUrl: false
                });
            });
            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin) return;
                const payload = event.data;
                if (!payload || payload.type !== 'synkrone:bots-route') return;
                const rawTab = typeof payload.tab === 'string' ? payload.tab.trim().toLowerCase() : '';
                navigateToMainSection('discord', {
                    subTab: 'bots',
                    botsTab: DISCORD_BOT_PAGES.has(rawTab) ? rawTab : null,
                    updateUrl: true,
                    replaceHistory: Boolean(payload.replaceHistory)
                });
            });
            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin) return;
                const payload = event.data;
                if (!payload || payload.type !== 'synkrone:modpack-route') return;
                const rawTab = typeof payload.tab === 'string' ? payload.tab.trim().toLowerCase() : '';
                if (!rawTab) return;
                const targetPath = `/minecraft/modpack/${rawTab}`;
                syncBrowserPath(targetPath, Boolean(payload.replaceHistory));
            });
            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin) return;
                const payload = event.data;
                if (!payload || payload.type !== 'synkrone:cloud-route') return;
                const rawPath = typeof payload.path === 'string' ? payload.path.trim() : '';
                if (!rawPath) return;
                syncBrowserPath(rawPath, Boolean(payload.replaceHistory));
            });
            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin) return;
                const payload = event.data;
                if (!payload || payload.type !== 'synkrone:user-updated') return;
                mergeSessionUserUpdate(payload.user || null);
            });
            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin) return;
                const payload = event.data;
                if (!payload || payload.type !== 'synkrone:krones-updated') return;
                if (payload.wallet && typeof payload.wallet === 'object') {
                    store.krones = payload.wallet;
                    if (store.user && typeof payload.wallet.balance === 'number') {
                        store.user.krone = payload.wallet.balance;
                        if (payload.wallet.plan) store.user.grade = payload.wallet.plan;
                    }
                    renderUI();
                }
            });
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    refreshSessionUserSilently();
                    loadKronesWallet().then(() => renderUI());
                }
            });
            window.setInterval(() => {
                refreshSessionUserSilently();
                loadKronesWallet().then(() => renderUI());
            }, 15000);
            window.addEventListener('resize', applyMobileHeaderBrandVisibility);
        })();
    </script>
    <div id="roulette-modal" class="roulette-modal" aria-hidden="true">
        <div class="roulette-modal-card">
            <button class="roulette-modal-close" onclick="closeRouletteModal()" aria-label="Fermer la roulette">×</button>
            <iframe class="roulette-modal-frame" src="/roulette.html"></iframe>
        </div>
    </div>
</body>
