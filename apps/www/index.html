<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkrone.app | Hub</title>
    <link rel="icon" type="image/png" href="/logo/Synk_FF0013.png">
    <link rel="stylesheet" href="/design/synkrone.css">
    <style>
        html, body { min-height: 100%; }
        body { padding: 20px 16px 32px; }
        .hub {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .hub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .hub-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hub-brand img { width: 32px; height: 32px; object-fit: contain; }
        .hub-brand h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: -0.03em;
        }
        .hub-brand h1 span { color: var(--sk-text-muted); font-weight: 500; }
        .hub-clock {
            text-align: right;
            font-family: var(--sk-mono);
        }
        #clock { font-size: 14px; color: var(--sk-text); }
        #date { font-size: 11px; color: var(--sk-text-faint); text-transform: uppercase; letter-spacing: 0.06em; }
        .hub-search-head, .fav-head, .infra-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .hub-kicker {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--sk-text-muted);
        }
        .engine-switch {
            display: flex;
            gap: 2px;
            padding: 2px;
            background: var(--sk-bg);
            border: 1px solid var(--sk-border);
            border-radius: var(--sk-radius);
        }
        .engine-switch button {
            min-height: 32px;
            padding: 0 10px;
            border: 0;
            background: transparent;
            color: var(--sk-text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-radius: 4px;
            cursor: pointer;
        }
        .engine-switch button.is-on {
            background: var(--sk-accent);
            color: #fff;
        }
        #searchForm { display: flex; gap: 8px; }
        #query { flex: 1; min-height: 40px; }
        .fav-groups { display: grid; gap: 10px; }
        .fav-group {
            display: grid;
            grid-template-columns: 88px 1fr;
            gap: 8px;
            align-items: start;
        }
        .fav-group b {
            font-size: 11px;
            font-weight: 700;
            color: var(--sk-text-faint);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding-top: 8px;
        }
        .fav-links { display: flex; flex-wrap: wrap; gap: 6px; }
        .fav-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            padding: 0 8px;
            border: 1px solid var(--sk-border);
            border-radius: var(--sk-radius);
            background: var(--sk-bg);
            color: var(--sk-text);
            text-decoration: none;
            font-size: 12px;
        }
        .fav-links a:hover { border-color: var(--sk-border-strong); background: var(--sk-surface-hover); }
        .fav-links img { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; }
        #infrastructureGrid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }
        .infra-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 44px;
            padding: 8px 10px;
            border: 1px solid var(--sk-border);
            border-radius: var(--sk-radius);
            background: var(--sk-bg);
            text-decoration: none;
            color: var(--sk-text);
        }
        .infra-link:hover { border-color: var(--sk-border-strong); background: var(--sk-surface-hover); }
        .infra-link.is-off { opacity: 0.55; cursor: pointer; }
        .infra-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .infra-left img { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
        .infra-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .infra-badge {
            font-family: var(--sk-mono);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        #toastModal {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translate(-50%, -12px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #toastModal.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-3px); }
            40%, 80% { transform: translateX(3px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
        @media (max-width: 720px) {
            .hub-header { flex-wrap: wrap; }
            .fav-group { grid-template-columns: 1fr; }
            #infrastructureGrid { grid-template-columns: 1fr; }
            .sk-app-nav { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div id="toastModal" class="sk-toast" role="status">Ce service n'est pas encore disponible pour le moment.</div>

    <div class="hub">
        <header class="hub-header">
            <div class="hub-brand">
                <img src="/logo/Synk_FF0013.png" alt="Synkrone">
                <div>
                    <h1>Synkrone<span>.app</span></h1>
                    <p class="sk-meta">Console interne</p>
                </div>
            </div>
            <nav class="sk-app-nav" aria-label="Applications">
                <a href="/">Site</a>
                <a href="/hub" class="is-active">Hub</a>
                <a href="/ui/">ui</a>
                <a href="/sharing/">sharing</a>
                <a href="/vux/">vux</a>
            </nav>
            <div class="hub-clock">
                <div id="clock"></div>
                <div id="date"></div>
            </div>
        </header>

        <section class="sk-card" style="padding: 14px;">
            <div class="hub-search-head">
                <span class="hub-kicker">Recherche</span>
                <div class="engine-switch">
                    <button type="button" id="btnWeb" class="is-on" onclick="setEngineMode('web')">Simple</button>
                    <button type="button" id="btnImage" onclick="setEngineMode('image')">Images</button>
                </div>
            </div>
            <form id="searchForm" onsubmit="handleSearch(event)">
                <input type="text" id="query" placeholder="Rechercher sur Google…">
                <button type="submit" class="sk-btn-primary">Rechercher</button>
            </form>
        </section>

        <section class="sk-card" style="padding: 14px;">
            <div class="fav-head"><span class="hub-kicker">Favoris</span></div>
            <div class="fav-groups">
                <div class="fav-group">
                    <b>Google</b>
                    <div class="fav-links">
                        <a href="https://gemini.google.com/app" target="_blank" rel="noopener"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Google_Gemini_icon_2025.svg/500px-Google_Gemini_icon_2025.svg.png" alt="">Gemini</a>
                        <a href="https://gmail.com" target="_blank" rel="noopener"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgxyJcKCFf08MBodXkOpG_wBv1MZCQk3VTGCFpI8Hy6w&s" alt="">Gmail</a>
                        <a href="https://drive.google.com" target="_blank" rel="noopener"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdtgUSpfqaiq5OVwiuBSCQwpbpdO7kY107W3QQ_aNQkw&s=10" alt="">Drive</a>
                        <a href="https://translate.google.com" target="_blank" rel="noopener"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9GWaIWwtZINigwMUSrwILvANebKJIUSkwTVlxb0NO4w&s" alt="">Traduction</a>
                    </div>
                </div>
                <div class="fav-group">
                    <b>Streaming</b>
                    <div class="fav-links">
                        <a href="https://youtube.com" target="_blank" rel="noopener"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/1280px-YouTube_full-color_icon_%282017%29.svg.png" alt="">YouTube</a>
                        <a href="https://twitch.tv" target="_blank" rel="noopener"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvIR0c6TlmdcMIFdx7olX3YOpSiD5nsZg2LOumXTvsig&s=10" alt="">Twitch</a>
                        <a href="https://netflix.com" target="_blank" rel="noopener"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ91gke83AgsjipPMZmrsDP0-K7oWgm4ZCkxZNh9Exo3Q&s=10" alt="">Netflix</a>
                        <a href="https://primevideo.com" target="_blank" rel="noopener"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSowpcXA4JAMw0PPpQPQox389iRicV_rOTiiOa0q4_D3A&s=10" alt="">Prime Video</a>
                        <a href="https://disneyplus.com" target="_blank" rel="noopener"><img src="https://static.vecteezy.com/system/resources/previews/073/495/217/non_2x/disney-plus-logo-circular-glossy-icon-with-transparent-background-free-png.png" alt="">Disney+</a>
                    </div>
                </div>
                <div class="fav-group">
                    <b>Outils</b>
                    <div class="fav-links">
                        <a href="https://github.com" target="_blank" rel="noopener"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQblkhBDCixhdGaP_B21didlIi1nkX4waw9wkGBKIevXg&s" alt="">GitHub</a>
                        <a href="https://discord.com/developers/applications" target="_blank" rel="noopener"><img src="https://media.licdn.com/dms/image/v2/D560BAQEj5DryL5O_7g/company-logo_200_200/B56Zi.iuHcHkAI-/0/1755543429939/discord_developers_logo?e=2147483647&v=beta&t=mDfN874nMC5IC2_pq1VXhbbj2YHEr3OB1ruQK7h1nG4" alt="">Discord Dev</a>
                        <a href="https://curseforge.com" target="_blank" rel="noopener"><img src="https://cdn.apexminecrafthosting.com/img/uploads/2021/05/21163117/curseforge-logo.png" alt="">CurseForge</a>
                        <a href="https://top.gg" target="_blank" rel="noopener"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZcGCxK-2YqDB5FF5FG7qCiVnkqPyfh_-IRpQHxKMD8g&s" alt="">Top.gg</a>
                        <a href="https://trello.com" target="_blank" rel="noopener"><img src="https://cdn-icons-png.flaticon.com/512/2504/2504834.png" alt="">Trello</a>
                        <a href="https://amazon.fr" target="_blank" rel="noopener"><img src="https://images.icon-icons.com/2429/PNG/512/amazon_logo_icon_147320.png" alt="">Amazon</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="sk-card" style="padding: 14px;">
            <div class="infra-head">
                <span class="hub-kicker">Infrastructure</span>
            </div>
            <div id="infrastructureGrid"></div>
        </section>
    </div>

    <script>
        const themes = [
            { name: 'Rouge', hex: '#FF0013', file: '/logo/Synk_FF0013.png', prefix: '', siteName: 'Synkrone.app', url: '/' },
            { name: 'Or', hex: '#FAB319', file: '/logo/Synk_FAB319.png', prefix: 'Gestion', siteName: 'PM2', url: '/admin/pm2', category: 'ADMIN' },
            { name: 'Bleu Clair', hex: '#005CFF', file: '/logo/Synk_005CFF.png', prefix: 'VPS', siteName: 'Code', url: '#', category: 'ADMIN' },
            { name: 'Violet', hex: '#8000A8', file: '/logo/Synk_8000A8.png', prefix: 'ui', siteName: 'Synkrone.app', url: '/ui/', category: 'ADMIN' },
            { name: 'Vert', hex: '#2B9348', file: '/logo/Synk_2B9348.png', prefix: 'sharing', siteName: 'Synkrone.app', url: '/sharing/', category: 'ADMIN' },
            { name: 'Rose', hex: '#D6007A', file: '/logo/Synk_D6007A.png', prefix: 'me', siteName: 'Synkrone.app', url: '/discord/me' },
            { name: 'Orange', hex: '#F25C05', file: '/logo/Synk_F25C05.png', prefix: 'dashbot', siteName: 'Synkrone.app', url: '/discord/dashbot' },
            { name: 'Bleu Foncé', hex: '#0026C8', file: '/logo/Synk_0026C8.png', prefix: 'bump', siteName: 'Synkrone.app', url: '/discord/bump' },
            { name: 'Marron', hex: '#4A2E1B', file: '/logo/Synk_4A2E1B.png', prefix: 'app', siteName: 'Synkrone.app', url: '/' },
            { name: 'Gris', hex: '#707273', file: '/logo/Synk_707273.png', prefix: 'cloud', siteName: 'Synkrone.app', url: '/equipe/cloud' },
            { name: 'Noir', hex: '#1A1A1A', file: '/logo/Synk_1A1A1A.png', prefix: 'status', siteName: 'Synkrone.app', url: '/stats' }
        ];

        let currentEngineMode = 'web';
        const infraGrid = document.getElementById('infrastructureGrid');
        let toastTimeout = null;

        function showUnavailableModal(element) {
            const modal = document.getElementById('toastModal');
            modal.classList.add('show');
            element.classList.add('shake');
            setTimeout(() => element.classList.remove('shake'), 300);
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => modal.classList.remove('show'), 2000);
        }

        themes.forEach((theme) => {
            const infraLink = document.createElement('a');
            if (theme.url === '#') {
                infraLink.href = 'javascript:void(0);';
                infraLink.className = 'infra-link is-off';
                infraLink.onclick = (e) => {
                    e.preventDefault();
                    showUnavailableModal(infraLink);
                };
            } else {
                infraLink.href = theme.url;
                infraLink.className = 'infra-link';
                if (!theme.url.startsWith('/')) infraLink.target = '_blank';
            }

            const prefix = theme.prefix
                ? `<span style="color:${theme.hex};font-weight:700">${theme.prefix}.</span>`
                : '';
            const badge = theme.category
                ? `<span class="infra-badge" style="background:${theme.hex}22;color:${theme.hex};border:1px solid ${theme.hex}55">${theme.category}</span>`
                : '';
            infraLink.innerHTML = `
                <div class="infra-left">
                    <img src="${theme.file}" alt="${theme.name}">
                    <div class="infra-name">${prefix}${theme.siteName}</div>
                </div>
                ${badge}
            `;
            infraGrid.appendChild(infraLink);
        });

        function setEngineMode(mode) {
            currentEngineMode = mode;
            document.getElementById('btnWeb').classList.toggle('is-on', mode === 'web');
            document.getElementById('btnImage').classList.toggle('is-on', mode === 'image');
        }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('query').value;
            if (!query) return;
            const url = currentEngineMode === 'web'
                ? `https://google.com/search?q=${encodeURIComponent(query)}`
                : `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(query)}`;
            window.open(url, '_blank');
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
