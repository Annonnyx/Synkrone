# Orbital development / single-node production stack.
#   docker compose up -d
# Only the control API talks to the Docker socket; the frontend never does.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [orbital-database]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    networks: [orbital-dashboard]

  panel:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      PLATFORM_DATA_DIR: /data
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:-change-me}
      DOCKER_SOCKET: /var/run/docker.sock
      RUNTIME_IMAGE_MODE: ${RUNTIME_IMAGE_MODE:-public}
      SFTP_HOST: ${SFTP_HOST:-sftp.localhost}
      ORBITAL_PUBLIC_ORIGIN: ${ORBITAL_PUBLIC_ORIGIN:-http://localhost:3000}
      ORBITAL_PUBLIC_DOMAIN: ${ORBITAL_PUBLIC_DOMAIN:-example.com}
      ORBITAL_PUBLIC_HOST: ${ORBITAL_PUBLIC_HOST:-}
      ORBITAL_PUBLIC_IP: ${ORBITAL_PUBLIC_IP:-}
      ORBITAL_PUBLIC_IPV6: ${ORBITAL_PUBLIC_IPV6:-}
      ORBITAL_TRAEFIK_DYNAMIC_DIR: /app/docker/proxy/dynamic
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    volumes:
      # The control API is the ONLY component with the docker socket, read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - orbital-data:/data
      - ./docker/proxy/dynamic:/app/docker/proxy/dynamic
    depends_on: [postgres, redis]
    networks: [orbital-dashboard, orbital-database, orbital-proxy]
    ports: ["3000:3000"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.panel.rule=Host(`panel.localhost`)

  proxy:
    image: traefik:v3.2
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/proxy/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks: [orbital-proxy, orbital-web]

  sftp:
    image: atmoz/sftp:alpine
    # Accounts are generated by SFTPManager into ${DATA}/sftp/users.conf,
    # each one chrooted to a single service volume.
    volumes:
      - orbital-data:/data
      - orbital-data/sftp/users.conf:/etc/sftp/users.conf:ro
    ports: ["2022:22"]
    networks: [orbital-dashboard]

volumes:
  pgdata:
  orbital-data:
  letsencrypt:

networks:
  orbital-dashboard:
  orbital-discord:
  orbital-minecraft:
  orbital-web:
  orbital-database:
  orbital-proxy:
